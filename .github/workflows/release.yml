name: Publish release + Android APK

# Runs when CHANGELOG.md on main gains a new "## vX.Y.Z" entry (or manually).
# 1) publishes a GitHub release with that version's notes
# 2) builds a signed Android APK (Capacitor WebView, Three.js bundled for offline use) and attaches it
# The app's "Check for Update" button opens /releases/latest, so it always lands on the newest one.
on:
  push:
    branches: [main]
    paths: ['CHANGELOG.md', 'index.html', 'android/**', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

env:
  THREE_VERSION: 0.160.0
  CAP_VERSION: '7'

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      ver: ${{ steps.v.outputs.ver }}
    steps:
      - uses: actions/checkout@v4
      - name: Read newest version and notes from CHANGELOG.md
        id: v
        run: |
          VER=$(grep -m1 -oE '^## v[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | sed 's/^## //')
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          awk -v v="## ${VER} " 'index($0,v)==1{f=1;next} /^## /{if(f)exit} f' CHANGELOG.md > notes.md
          {
            echo "## What's new in ${VER}"; cat notes.md; echo
            echo "### Install on Android"
            echo "Download **NomadForge-3D-${VER}.apk** below, open it, and allow your browser to install unknown apps if asked. Installing over an older version keeps your saved builds."
          } > body.md
          cat body.md
      - name: Create release if it doesn't exist yet
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.v.outputs.ver }}
        run: |
          if gh release view "$VER" >/dev/null 2>&1; then echo "Release $VER already exists"; exit 0; fi
          gh release create "$VER" --target "$GITHUB_SHA" --title "NomadForge 3D $VER" --notes-file body.md --latest

  apk:
    needs: release
    runs-on: ubuntu-latest
    env:
      VER: ${{ needs.release.outputs.ver }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare web bundle (Three.js vendored for offline use)
        run: |
          mkdir -p app/www/vendor/three/build app/www/vendor/three/examples/jsm/controls app/www/vendor/three/examples/jsm/environments
          CDN="https://cdn.jsdelivr.net/npm/three@${THREE_VERSION}"
          curl -fsSL "$CDN/build/three.module.js" -o app/www/vendor/three/build/three.module.js
          curl -fsSL "$CDN/examples/jsm/controls/OrbitControls.js" -o app/www/vendor/three/examples/jsm/controls/OrbitControls.js
          curl -fsSL "$CDN/examples/jsm/environments/RoomEnvironment.js" -o app/www/vendor/three/examples/jsm/environments/RoomEnvironment.js
          sed "s#https://cdn.jsdelivr.net/npm/three@${THREE_VERSION}/#./vendor/three/#g" index.html > app/www/index.html
          grep -n 'vendor/three' app/www/index.html

      - name: Create Capacitor Android project
        working-directory: app
        run: |
          npm init -y >/dev/null
          npm i "@capacitor/core@${CAP_VERSION}" "@capacitor/cli@${CAP_VERSION}" "@capacitor/android@${CAP_VERSION}"
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.mrsirwithpizza101.nomadforge",
            "appName": "NomadForge 3D",
            "webDir": "www",
            "backgroundColor": "#121417",
            "android": { "adjustMarginsForEdgeToEdge": "force", "backgroundColor": "#121417" },
            "plugins": { "CapacitorHttp": { "enabled": true } }
          }
          JSON
          npx cap add android
          npx cap sync android
          cp -r ../android/res/* android/app/src/main/res/
          # version from CHANGELOG (v1.2.3 -> name 1.2.3, code 10203)
          NAME="${VER#v}"; IFS=. read -r MA MI PA <<< "$NAME"; CODE=$((MA*10000+MI*100+PA))
          sed -i -E "s/versionCode [0-9]+/versionCode ${CODE}/; s/versionName \"[^\"]*\"/versionName \"${NAME}\"/" android/app/build.gradle
          grep -nE 'versionCode|versionName' android/app/build.gradle

      - name: Build release APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Sign APK
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          IN=app/android/app/build/outputs/apk/release/app-release-unsigned.apk
          OUT="NomadForge-3D-${VER}.apk"
          "$BT/zipalign" -p -f 4 "$IN" aligned.apk
          "$BT/apksigner" sign --ks android/signing/nomadforge.keystore --ks-key-alias nomadforge \
            --ks-pass pass:nomadforge3d --key-pass pass:nomadforge3d --out "$OUT" aligned.apk
          "$BT/apksigner" verify --print-certs "$OUT" | head -3
          ls -lh "$OUT"

      - name: Attach APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$VER" "NomadForge-3D-${VER}.apk" --clobber
