<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>NomadForge 3D — Off-Grid Rig Configurator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#121417; --panel:#1E2228; --panel2:#252A31; --panel3:#2C323A; --line:#323941; --line2:#3b434d;
  --text:#E7EAEE; --muted:#8C95A1; --dim:#5f6873;
  --cyan:#2FD6EE; --cyan2:#1aa9bf; --amber:#F5B440; --red:#F27474; --green:#4ADE80;
  --mono:'JetBrains Mono',ui-monospace,monospace; --sans:'Inter',system-ui,-apple-system,sans-serif;
  --lw:280px; --rw:310px; --top:52px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:13px;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#363d46;border-radius:8px}::-webkit-scrollbar-track{background:transparent}

/* ---------- top bar ---------- */
#top{height:var(--top);display:flex;align-items:center;gap:12px;padding:0 12px;background:#16191D;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:.14em;font-size:13px;white-space:nowrap}
.brand b{color:var(--cyan);font-weight:700}
.brand svg{flex:none}
#buildName{background:transparent;border:1px solid transparent;border-radius:6px;padding:6px 8px;min-width:0;width:220px;font-weight:500;color:var(--text)}
#buildName:hover{border-color:var(--line)}#buildName:focus{outline:none;border-color:var(--cyan2);background:var(--panel)}
.spacer{flex:1}
.tb-btn{height:32px;padding:0 11px;border-radius:7px;border:1px solid var(--line);background:var(--panel);display:inline-flex;align-items:center;gap:6px;font-weight:500;white-space:nowrap;transition:.15s}
.tb-btn:hover{border-color:var(--line2);background:var(--panel2)}
.tb-btn.primary{background:var(--cyan);color:#062028;border-color:var(--cyan);font-weight:600}
.tb-btn.primary:hover{filter:brightness(1.08)}
.tb-btn.icon{width:32px;padding:0;justify-content:center}
.tb-btn.on{border-color:var(--cyan2);color:var(--cyan)}

/* ---------- layout ---------- */
main{display:grid;grid-template-columns:var(--lw) 1fr var(--rw);height:calc(100dvh - var(--top));transition:grid-template-columns .25s}
main.noL{--lw:0px} main.noR{--rw:0px}
aside{background:var(--panel);overflow:hidden;display:flex;flex-direction:column;min-width:0}
#left{border-right:1px solid var(--line)} #right{border-left:1px solid var(--line)}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;padding:12px 4px;font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid transparent}
.tabs button.on{color:var(--text);border-bottom-color:var(--cyan)}
.pane{overflow:auto;flex:1;padding:12px}
.pane[hidden]{display:none}
.h{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:14px 2px 8px}
.h:first-child{margin-top:2px}
.muted{color:var(--muted)} .mono{font-family:var(--mono)}

/* vehicle cards */
.vcard{width:100%;text-align:left;padding:10px 11px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);margin-bottom:7px;display:flex;gap:10px;align-items:center;transition:.15s}
.vcard:hover{border-color:var(--line2)}
.vcard.on{border-color:var(--cyan);box-shadow:inset 3px 0 0 var(--cyan)}
.vcard svg{flex:none;opacity:.85}
.vcard .t{font-weight:600}.vcard .s{font-size:11px;color:var(--muted);margin-top:2px}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:3px;gap:3px}
.seg button{flex:1;padding:7px 4px;border-radius:6px;font-weight:500;font-size:12px;color:var(--muted)}
.seg button.on{background:var(--panel3);color:var(--text);box-shadow:0 0 0 1px var(--line2)}
.swatches{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line2);cursor:pointer}
.sw.on{box-shadow:0 0 0 2px var(--cyan)}
.sw input{opacity:0;width:100%;height:100%;cursor:pointer}
.spec{display:grid;grid-template-columns:1fr auto;gap:5px 10px;font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 11px}
.spec span:nth-child(even){font-family:var(--mono);text-align:right}

/* catalog */
details.cat{border:1px solid var(--line);border-radius:9px;margin-bottom:8px;background:var(--panel2);overflow:hidden}
details.cat summary{list-style:none;padding:10px 11px;cursor:pointer;display:flex;align-items:center;gap:8px;font-weight:600}
details.cat summary::-webkit-details-marker{display:none}
details.cat summary .cnt{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--cyan);background:rgba(47,214,238,.1);padding:1px 7px;border-radius:10px}
details.cat summary .chev{transition:.2s;color:var(--muted)}
details.cat[open] summary .chev{transform:rotate(90deg)}
.item{display:flex;align-items:center;gap:8px;padding:8px 11px;border-top:1px solid var(--line);cursor:pointer;transition:background .12s}
.item:hover{background:var(--panel3)}
.item .nm{font-weight:500;line-height:1.25}
.item .mt{font-size:11px;color:var(--muted);font-family:var(--mono);margin-top:2px}
.item .st{margin-left:auto;flex:none;display:flex;gap:4px;align-items:center}
.item.in{box-shadow:inset 3px 0 0 var(--cyan)}
.item.in .nm{color:var(--cyan)}
.tag{font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:2px 6px;border-radius:5px}
.tag.swap{color:var(--amber);background:rgba(245,180,64,.12)}
.tag.ok{color:var(--cyan);background:rgba(47,214,238,.12)}
.x{width:22px;height:22px;border-radius:5px;color:var(--muted);display:grid;place-items:center}
.x:hover{background:rgba(242,116,116,.15);color:var(--red)}

/* finishes */
.mats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.mat{border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--panel2);text-align:left;transition:.15s}
.mat:hover{border-color:var(--line2)}
.mat.on{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan)}
.mat img{display:block;width:100%;height:46px;object-fit:cover}
.mat span{display:block;padding:6px 8px;font-size:11px;font-weight:500;line-height:1.25}

/* ---------- viewport ---------- */
#vp{position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 35%,#1b1f25 0%,#121417 70%)}
#vp canvas{display:block;width:100%;height:100%;outline:none;touch-action:none}
.glass{background:rgba(24,27,32,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:10px}
#toolbar{position:absolute;left:12px;top:12px;display:flex;flex-direction:column;gap:6px;padding:7px;z-index:5;max-height:calc(100% - 110px);overflow:auto}
.tgl{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 8px;border-radius:7px;min-width:132px;font-weight:500;font-size:12px}
.tgl:hover{background:var(--panel3)}
.mode{font-family:var(--mono);font-size:10px;font-weight:600;padding:2px 6px;border-radius:4px;letter-spacing:.04em}
.mode.solid{color:#c8cfd8;background:#2f363f}.mode.ghost{color:var(--cyan);background:rgba(47,214,238,.13)}.mode.hidden{color:var(--dim);background:#1a1d22;text-decoration:line-through}
.mode.on{color:var(--amber);background:rgba(245,180,64,.13)}.mode.off{color:var(--dim);background:#1a1d22}
.tsep{height:1px;background:var(--line);margin:2px 4px}
.tbl{font-size:10px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;font-weight:600;padding:2px 8px 0}
#cams{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:3px;padding:6px;z-index:5}
#cams button{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 8px;border-radius:7px;font-size:12px;font-weight:500;text-align:left}
#cams button:hover{background:var(--panel3)}
#cams button.on{color:var(--cyan)}
kbd{font-family:var(--mono);font-size:10px;padding:1px 5px;border-radius:4px;background:#2b3138;color:var(--muted);border:1px solid #39414a}
#hud[hidden]{display:none !important}
#hud{position:absolute;left:50%;top:12px;transform:translateX(-50%);display:flex;gap:2px;padding:4px;z-index:4}
.chip{padding:5px 10px;border-radius:7px;display:flex;flex-direction:column;align-items:center;min-width:76px}
.chip b{font-family:var(--mono);font-size:13px;font-weight:600}
.chip small{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.chip.warn b{color:var(--amber)}.chip.bad b{color:var(--red)}.chip.good b{color:var(--green)}
#bottom{position:absolute;left:12px;right:12px;bottom:12px;display:flex;gap:10px;z-index:5;align-items:stretch}
#phaseBar{flex:1;display:flex;align-items:center;gap:6px;padding:7px;min-width:0;overflow-x:auto}
.ph{display:flex;align-items:center;gap:7px;padding:6px 10px;border-radius:7px;white-space:nowrap;font-size:12px;font-weight:500;color:var(--muted);border:1px solid transparent}
.ph .n{font-family:var(--mono);width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:#2a3037;font-size:10px;color:var(--muted)}
.ph:hover{background:var(--panel3)}
.ph.on{color:var(--text);border-color:var(--line2);background:var(--panel2)}
.ph.on .n,.ph.done .n{background:var(--amber);color:#2a1a00}
.ph.done{color:#c9ced6}
.arrow{color:var(--dim);flex:none}
#explodeBox{display:flex;align-items:center;gap:10px;padding:7px 12px;flex:none;width:280px}
#explodeBox label{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--cyan) var(--p,0%),#323941 var(--p,0%));outline:none;min-width:60px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--cyan);cursor:pointer}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--cyan);cursor:pointer}
#explodeVal{font-family:var(--mono);font-size:12px;width:36px;text-align:right;color:var(--cyan)}
#pop{position:absolute;z-index:8;width:270px;padding:0;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.45)}
#pop[hidden]{display:none}
.pop-h{display:flex;align-items:flex-start;gap:8px;padding:11px 12px 6px}
.pop-h b{font-size:13px;line-height:1.3}
.pop-h .x{margin-left:auto;flex:none}
.pop-meta{padding:0 12px 10px;font-family:var(--mono);font-size:11px;color:var(--muted)}
.pop-act{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-top:1px solid var(--line)}
.pop-act button{background:#1b1f24;padding:9px 6px;font-size:12px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:6px}
.pop-act button:hover:not(:disabled){background:var(--panel3)}
.pop-act button:disabled{color:#4b535d;cursor:default}
.pop-act button.on{color:var(--cyan)}
.pop-act .danger{color:var(--red)}
.pop-sub{border-top:1px solid var(--line);padding:10px 12px;max-height:240px;overflow:auto}
.pop-sub:empty{display:none}
.vrow{display:flex;justify-content:space-between;gap:8px;width:100%;padding:7px 8px;border-radius:6px;text-align:left;font-size:12px}
.vrow:hover{background:var(--panel3)}.vrow.on{color:var(--cyan)}
.vrow span:last-child{font-family:var(--mono);color:var(--muted);font-size:11px}
.msw{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.msw button{border:1px solid var(--line);border-radius:6px;overflow:hidden;padding:0}
.msw button.on{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan)}
.msw img{width:100%;height:30px;display:block;object-fit:cover}
.msw span{display:block;font-size:10px;padding:3px 4px;line-height:1.2;text-align:left}
.sublbl{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:2px 0 6px}
#loading{position:absolute;inset:0;display:grid;place-items:center;z-index:20;background:var(--bg);color:var(--muted);font-family:var(--mono);font-size:12px;letter-spacing:.1em;transition:opacity .4s}
#loading.gone{opacity:0;pointer-events:none}

/* ---------- tracker ---------- */
.card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.card h3{margin:0 0 10px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:8px}
.card h3 .r{margin-left:auto;text-transform:none;letter-spacing:0;font-family:var(--mono);color:var(--text);font-size:12px}
.big{font-family:var(--mono);font-size:24px;font-weight:600;letter-spacing:-.02em}
.big small{font-size:12px;color:var(--muted);font-weight:500;margin-left:4px}
.bar{height:8px;border-radius:5px;background:#15181c;overflow:hidden;position:relative;margin:8px 0 4px}
.bar>i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--cyan);transition:width .4s}
.row{display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:3px 0}
.row span:last-child{font-family:var(--mono)}
.row.sub{color:var(--muted);font-size:11.5px}
.warns{margin-top:8px;display:flex;flex-direction:column;gap:5px}
.warn{font-size:11.5px;line-height:1.35;padding:7px 9px;border-radius:7px;background:rgba(245,180,64,.08);border:1px solid rgba(245,180,64,.25);color:#f3cf8a}
.warn.bad{background:rgba(242,116,116,.08);border-color:rgba(242,116,116,.3);color:#f5a9a9}
.ctl{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);margin-top:6px}
.ctl span:first-child{width:92px;flex:none}.ctl b{font-family:var(--mono);color:var(--text);font-weight:500;width:46px;text-align:right;flex:none}
.score{display:flex;align-items:center;gap:12px}
.ring{flex:none}
.pbars{display:flex;gap:3px;height:34px;align-items:flex-end;margin:6px 0 2px}
.pbars div{flex:1;border-radius:3px 3px 0 0;background:var(--amber);min-height:2px;opacity:.85}
.plbl{display:flex;gap:3px}.plbl span{flex:1;text-align:center;font-family:var(--mono);font-size:10px;color:var(--muted)}
table.bom{width:100%;border-collapse:collapse;font-size:11.5px}
.bom th{text-align:left;font-weight:600;color:var(--muted);font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:4px 3px;border-bottom:1px solid var(--line)}
.bom td{padding:5px 3px;border-bottom:1px solid #2a3037;vertical-align:top}
.bom td.n{font-family:var(--mono);text-align:right;white-space:nowrap}
.bom th.n{text-align:right}
.bom tr.ph td{color:var(--amber);font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;padding-top:9px}
.bom tr.tot td{font-weight:600;border-bottom:0;padding-top:8px}
.btnrow{display:flex;gap:6px;margin-top:10px}
.btnrow .tb-btn{flex:1;justify-content:center;height:30px;font-size:12px}
.toggle{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);cursor:pointer;margin-top:6px}
.toggle input{accent-color:var(--cyan)}

/* ---------- modal & toast ---------- */
#modal{position:fixed;inset:0;background:rgba(5,7,9,.6);display:grid;place-items:center;z-index:50;padding:16px}
#modal[hidden]{display:none}
.mbox{width:min(560px,100%);max-height:86dvh;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line2);border-radius:12px;box-shadow:0 30px 70px rgba(0,0,0,.5)}
.mhead{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);font-weight:600}
.mhead .x{margin-left:auto}
.mbody{padding:14px 16px;overflow:auto}
.mbody textarea{width:100%;min-height:220px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;font-family:var(--mono);font-size:11.5px;resize:vertical;color:#cfd6de}
.mfoot{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.blist{display:flex;flex-direction:column;gap:6px}
.bitem{display:flex;align-items:center;gap:8px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel2)}
.bitem .grow{flex:1;min-width:0}.bitem .grow div:last-child{font-size:11px;color:var(--muted);font-family:var(--mono);margin-top:2px}
#toast{position:fixed;left:50%;top:64px;transform:translate(-50%,-12px);opacity:0;background:#0f1215;border:1px solid var(--line2);padding:9px 14px;border-radius:9px;font-size:12.5px;z-index:60;transition:.25s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast b{color:var(--cyan);font-weight:600}

#mnav{display:none}
.set-sec{border:1px solid var(--line);border-radius:10px;background:var(--panel2);padding:14px;margin-bottom:12px}
.set-sec h4{margin:0 0 10px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:8px}
.set-sec h4 .ver{margin-left:auto;font-family:var(--mono);letter-spacing:0;text-transform:none;color:var(--cyan);background:rgba(47,214,238,.1);padding:2px 8px;border-radius:10px}
.set-sec p{margin:0 0 8px;line-height:1.55;font-size:12.5px;color:#cdd3da}
.set-sec ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.set-sec li{font-size:12.5px;line-height:1.45;color:#cdd3da}
.set-sec li::marker{color:var(--amber)}
.set-meta{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:12px;margin-top:10px}
.set-meta span:nth-child(odd){color:var(--muted)} .set-meta span:nth-child(even){font-family:var(--mono)}
.upd-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:40px;border-radius:9px;background:var(--cyan);color:#062028;font-weight:600;text-decoration:none;font-size:13px}
.upd-btn:hover{filter:brightness(1.08)}
.set-note{font-size:11px;color:var(--muted);text-align:center;margin-top:8px}
.short{display:none}

/* ---------- responsive ---------- */
@media (max-width:1180px){ :root{--lw:250px;--rw:280px} #explodeBox{width:220px} #hud{display:none} }
@media (max-width:860px){
  :root{--top:50px}
  #buildName,.hide-m{display:none}
  main{grid-template-columns:1fr !important;height:calc(100dvh - var(--top) - 58px)}
  aside{position:fixed;left:0;right:0;bottom:58px;height:62dvh;z-index:30;border:0 !important;border-top:1px solid var(--line2) !important;border-radius:14px 14px 0 0;transform:translateY(105%);transition:transform .28s ease;box-shadow:0 -20px 40px rgba(0,0,0,.4)}
  aside.open{transform:none}
  #mnav{display:flex;position:fixed;left:0;right:0;bottom:0;height:58px;background:#16191D;border-top:1px solid var(--line);z-index:35;padding-bottom:env(safe-area-inset-bottom)}
  #mnav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;color:var(--muted);font-weight:500}
  #mnav button.on{color:var(--cyan)}
  #toolbar{flex-direction:row;flex-wrap:nowrap;left:8px;right:8px;top:8px;overflow-x:auto;max-height:none;padding:5px;gap:3px}
  .tgl{min-width:auto;flex-direction:column;gap:3px;padding:5px 7px}
  .tsep{width:1px;height:auto;margin:3px 1px}
  .tbl{display:none}
  #cams{top:auto;bottom:118px;right:8px;flex-direction:row;padding:4px;gap:2px}
  #cams button{padding:6px 8px}
  #cams .lbl{display:none}
  #bottom{left:8px;right:8px;bottom:8px;flex-direction:column;gap:6px}
  #explodeBox{width:auto}
  .ph .t{display:none}.ph .t.keep{display:inline}.ph{padding:6px 8px}
  .long{display:none}.short{display:inline !important}
  #cams kbd{display:none}
  #pop{left:8px !important;right:8px;width:auto;top:auto !important;bottom:168px}
}
</style>
<script type="importmap">

  const cg=new THREE.Group(); g.add(cg); reg(cg,45,0,0);
  let pts, ws, sideWin, ch, seatX, dash;
  if(c.kind==='van'){
    ch=Math.min(H,52);
    pts=[[0,f-12],[CL,f-12],[CL+1,f+6],[CL-2,f+16],[CL-26,f+21],[CL*.34,f+ch],[0,f+ch]]; ws=[4,5];
    sideWin=[CL*.08,CL*.4,f+ch-21,f+ch-3]; seatX=CL*.22; dash=CL-30;
  } else if(c.kind==='pickup'){
    ch=44; pts=[[4,f-16],[CL,f-16],[CL+1,f+2],[CL-2,f+14],[64,f+18],[56,f+ch],[8,f+ch],[4,f+ch-4]]; ws=[4,5];
    sideWin=[12,52,f+22,f+ch-3]; seatX=26; dash=60;
  } else if(c.kind==='box'){
    ch=46; pts=[[6,f-22],[CL,f-22],[CL+1,f-2],[CL-2,f+10],[70,f+14],[62,f+ch],[10,f+ch],[6,f+ch-4]]; ws=[4,5];
    sideWin=[14,58,f+18,f+ch-3]; seatX=30; dash=66;
  } else {
    ch=H; pts=[[0,f-12],[CL,f-12],[CL+1,f+2],[CL-2,f+14],[44,f+18],[40,f+H-4],[35,f+H+1.2],[0,f+H+1.2]]; ws=[4,5];
    sideWin=[4,34,f+H-30,f+H-8]; seatX=18; dash=40;
  }
  c.cabTop=f+ch; c.seatX=L+seatX;
  const shape=new THREE.Shape(pts.map(p=>new THREE.Vector2(L+p[0],p[1])));
  const geo=new THREE.ExtrudeGeometry(shape,{depth:W-3,bevelEnabled:true,bevelThickness:1.5,bevelSize:1.5,bevelSegments:3,curveSegments:4});
  geo.translate(0,0,-(W-3)/2);
  const body=mesh(geo,c.kind==='bus'?paintMat:paintMat); cg.add(body); layerize(body,'cab');
  // windshield
  const a=pts[ws[0]], b=pts[ws[1]], dx=b[0]-a[0], dy=b[1]-a[1], len=Math.hypot(dx,dy);
  const nx=dy/len, ny=-dx/len;
  const wsm=mesh(new THREE.BoxGeometry(len-3,.4,W-9),M.glass);
  wsm.position.set(L+(a[0]+b[0])/2+nx*1.7,(a[1]+b[1])/2+ny*1.7,0); wsm.rotation.z=Math.atan2(dy,dx); cg.add(wsm); layerize(wsm,'cab');
  for(const s of [-1,1]){
    layerize(B(L+sideWin[0],L+sideWin[1],sideWin[2],sideWin[3],s>0?W/2:-W/2-.35,s>0?W/2+.35:-W/2,M.glass,cg),'cab');
    // mirrors
    const mx=L+(c.kind==='bus'?40:sideWin[1]+2);
    layerize(B(mx-2,mx,sideWin[2]-6,sideWin[2]+4,s*(W/2+4)-1.5,s*(W/2+4)+1.5,M.black,cg),'cab');
    layerize(B(mx-1.5,mx-.5,sideWin[2]-2,sideWin[2]-1,s>0?W/2:-W/2-4,s>0?W/2+4:-W/2,M.black,cg),'cab');
    // headlights
    layerize(B(L+CL-1,L+CL+1.2,pts[3][1]-7,pts[3][1]-2,s*(W/2-9)-4,s*(W/2-9)+4,M.head,cg),'cab');
  }
  layerize(B(L+CL,L+CL+1.4,f-4,pts[3][1]-8,-W*.28,W*.28,M.black,cg),'cab');
  layerize(B(L+CL-4,L+CL+2.5,c.wheelR*.7,c.wheelR*.7+8,-W/2+1,W/2-1,M.black,cg),'cab');
  // fairing for high roof vans
  if(c.kind==='van' && H>ch+4){
    const sh=new THREE.Shape([new THREE.Vector2(L-1,f+ch),new THREE.Vector2(L+CL*.4,f+ch),new THREE.Vector2(L-1,c.roofTop)]);
    const fg=new THREE.ExtrudeGeometry(sh,{depth:W-3,bevelEnabled:true,bevelThickness:1.5,bevelSize:1.2,bevelSegments:2}); fg.translate(0,0,-(W-3)/2);
    const fm=mesh(fg,paintMat); cg.add(fm); layerize(fm,'cab');
  }
  // interior (not layered → visible through ghost cab)
  const inner=new THREE.Group(); root.add(inner); c.cabInner=inner;
  B(L+dash-8,L+dash+2,f+20,f+30,-W/2+3,W/2-3,M.dark,inner);
  B(L+dash-9,L+dash-7,f+30,f+31,-W/2+8,-6,M.screen,inner);
  const sw=mesh(new THREE.TorusGeometry(7.5,.9,10,28),M.black); sw.position.set(L+dash-13,f+29,-W/4); sw.rotation.y=Math.PI/2; sw.rotation.x=-.5; inner.add(sw);
  if(c.kind!=='van') B(L+4,L+6,f,f+ch-2,-W/2+2,W/2-2,M.dark,inner); // cab back wall
  if(!c.has('swivel')){ seat(L+seatX,-W/4,0,inner,c); if(c.kind!=='bus') seat(L+seatX,W/4,0,inner,c); }
}
function seat(x,z,rot,parent,c){
  const s=new THREE.Group(); s.position.set(x,c.f,z); s.rotation.y=rot; parent.add(s);
  B(-9,9,0,9,-8,8,M.dark,s); B(-10,10,9,14,-10,10,M.seat,s);
  const back=B(-12,-7,14,40,-10,10,M.seat,s); back.rotation.z=.12;
  B(-12,-7.5,40,47,-6,6,M.seat,s);
  return s;
}

  B(x0,x1,y0+3,y1,z0,z1,k,g);
  B(x0+.5,x1-.5,y0,y0+3,front>0?z0:z0+3,front>0?z1-3:z1,M.black,g);
  const n=Math.max(1,Math.round((x1-x0)/19)), w=(x1-x0)/n, zf=front>0?z1:z0;
  for(let i=0;i<n;i++){
    const a=x0+i*w+.35,b=x0+(i+1)*w-.35;
    B(a,b,y1-9,y1-1,front>0?zf:zf-.7,front>0?zf+.7:zf,k,g);
    B(a,b,y0+3.6,y1-9.6,front>0?zf:zf-.7,front>0?zf+.7:zf,k,g);

  }
}

function disposeTree(o){ o.traverse(n=>{ if(n.geometry) n.geometry.dispose(); if(n.isSprite){n.material.map?.dispose();n.material.dispose();} }); }
function rebuild(){
  for(const ch of [...root.children]){ disposeTree(ch); root.remove(ch); }
  EXPL=[]; instGroups=new Map(); doorRefs={};
  const c=makeCtx(); C=c;
  root.position.set(-c.T/2*IN,0,0); root.updateMatrixWorld(true);
  buildShell(c);
  const order=[...S.items].sort((a,b)=>(ITEM[a.cid].zone==='galleyD'?-1:0)-(ITEM[b.cid].zone==='galleyD'?-1:0));
  for(const inst of order){
    const it=ITEM[inst.cid], g=new THREE.Group(); g.userData.iid=inst.iid; root.add(g);
    try{ BUILD[inst.cid](c,inst,g); }catch(e){ console.error('build',inst.cid,e); }
    g.traverse(o=>{o.userData.iid=inst.iid;});
    instGroups.set(inst.iid,g);
    if(!g.userData.ex && !g.children.some(ch=>ch.userData.ex)) autoExplode(c,it,g);
  }
  buildServices(c); buildDims(c);
  root.updateMatrixWorld(true);
  computeCG();
  applyVisibility();
  if(view.sel && !instGroups.has(view.sel)) deselect();
  // interior light
  interior.position.set((c.L*.5-c.T/2)*IN,(c.ceilY-6)*IN,0); interior.intensity=S.items.some(i=>i.cid==='panel')?14:6;
}
const EXDIR = {solar:[0,115,0],rack:[0,92,0],fan:[0,72,0],ac:[0,78,0],awning:[0,30,60],carrier:[-45,0,0],armor:[45,0,0],shore:[0,0,-50],grey:[0,-30,0],
  okit:[-28,0,8],oshower:[-18,0,10],sink:[0,16,0],cook:[0,22,0],swivel:[16,0,0],hydronic:[0,-6,0],heater:[10,0,12],dcdc:[0,8,-10],inverter:[0,8,-12],battery:[0,0,-14],fresh:[0,0,-16]};
function autoExplode(c,it,g){
  const d=EXDIR[it.zone];
  if(d){ reg(g,d[0],d[1],d[2]); return; }
  const bb=new THREE.Box3().setFromObject(g); if(bb.isEmpty()) return;
  const ctr=bb.getCenter(V3(0,0,0)).divideScalar(IN); ctr.x+=c.T/2;
  const v=V3(ctr.x-c.L/2,6,ctr.z); v.y=0; if(v.length()<1) v.set(1,0,0); v.normalize().multiplyScalar(14); v.y=6;
  reg(g,v.x,v.y,v.z);
}
let CG = {front:.5,right:.5,x:0,z:0};
function computeCG(){
  const c=C; let W=0,mx=0,mz=0;
  const add=(w,x,z)=>{W+=w;mx+=w*x;mz+=w*z;};
  for(const inst of S.items){ const g=instGroups.get(inst.iid); if(!g) continue;
    const bb=new THREE.Box3().setFromObject(g); if(bb.isEmpty()) continue; const p=bb.getCenter(V3(0,0,0));
    const x=p.x/IN+c.T/2, z=p.z/IN, it=ITEM[inst.cid];
    add(it.wt,x,z); if(it.fresh&&S.settings.fullWater) add(it.fresh*8.34,x,z); }
  if(S.settings.cargo) add(S.settings.cargo,c.L*.5,0);
  if(!W){ CG={front:0,right:.5,x:c.L/2,z:0,w:0}; return; }
  const x=mx/W, z=mz/W, front=Math.min(1,Math.max(0,(x-c.xr)/(c.xf-c.xr)));
  CG={front,right:Math.min(1,Math.max(0,(z+c.W/2)/c.W)),x,z,w:W};

function phaseOK(it){ return !view.phase || it.phase<=view.phase; }
function applyVisibility(){
  root.traverse(o=>{
    const L=o.userData.layer; if(!L) return;
    const mode=view.layers[L];
    if(o.userData.edge){ o.visible = mode==='ghost'; return; }
    if(!o.isMesh) return;
    o.visible = mode!=='hidden';
    o.material = mode==='ghost' ? (L==='walls'?ghostMatW:ghostMat) : o.userData.solid;
    o.castShadow = mode==='solid';
  });
  for(const inst of S.items){ const g=instGroups.get(inst.iid); if(g) g.visible = !view.hidden.has(inst.iid) && phaseOK(ITEM[inst.cid]); }
  if(servicesGroup) servicesGroup.visible = !view.phase || view.phase>=2;

}

/* =====================================================================
   CALCULATIONS
   ===================================================================== */
function calc(){
  const c=C, v=c.v, st=S.settings;
  let cost=0,wt=0,solarW=0,ah=0,invW=0,alt=0,fresh=0,grey=0; const loads=[]; const byPhase={1:0,2:0,3:0,4:0};
  for(const inst of S.items){ const it=ITEM[inst.cid];
    cost+=it.cost; wt+=it.wt; byPhase[it.phase]+=it.cost; solarW+=it.solarW||0; ah+=it.ah||0; invW=Math.max(invW,it.invW||0); alt+=it.altA||0;
    fresh+=it.fresh||0; grey+=it.grey||0; if(it.draw) loads.push([it.name.replace(/ \(.*\)/,''),it.draw]); }
  if(ah) loads.push(['Phones, laptop, pump & misc.',180]);
  const water = st.fullWater? fresh*8.34 : 0;
  const payload = v.gvwr - v.curb;
  const total = wt + water + (+st.cargo||0);
  const harvest = solarW*st.sunHours*.75, altWh = alt*13.8*st.driveHours, draw = loads.reduce((a,l)=>a+l[1],0);
  const usable = ah*12.8*.9, net = harvest+altWh-draw;
  const days = !ah ? 0 : draw<=0 ? Infinity : net>=0 ? Infinity : usable/(-net);
  const dark = ah&&draw? usable/draw : 0;
  const waterDays = fresh/3;
  const pScore = days===Infinity? 60 : Math.min(60, days/7*60), wScore = Math.min(40, waterDays/7*40);
  const score = Math.round((ah?pScore:0)+wScore);
  const warns=[];
  const has=z=>c.has(z), cid=z=>has(z)?.cid;
  if(total>payload) warns.push(['bad',`Over payload by ${fmtN(total-payload)} lb — exceeds GVWR of ${fmtN(v.gvwr)} lb.`]); else if(total>payload*.85) warns.push(['',`Within 15% of payload capacity (${fmtN(payload-total)} lb left).`]);
  if(cid('cook')==='induction' && invW<1800) warns.push(['bad','Induction cooktop needs an inverter of at least 1800 W.']);
  if(has('ac') && invW<3000) warns.push(['bad','Rooftop A/C needs the 3000 W inverter.']);
  if(has('ac') && ah<400) warns.push(['','A/C on battery really wants 400 Ah or more.']);
  if((solarW||invW||alt) && !ah) warns.push(['bad','Solar / inverter / DC-DC installed with no battery bank.']);
  if((has('sink')||c.bath||has('oshower')) && !fresh) warns.push(['','Water fixtures installed but no fresh water tank.']);
  if((has('sink')||c.bath) && !grey) warns.push(['','No grey tank — sink/shower drain has nowhere to go.']);
  if(has('ac') && cid('solar')==='solar800' && c.roofEndX < (c.solarRows||0)*60+44) warns.push(['','Roof is crowded: 800 W array overlaps the A/C footprint.']);
  if(has('galleyP') && has('galleyD') && c.kind==='pickup') warns.push(['','Two galleys in a truck camper leaves little aisle.']);
  if(CG.w && Math.abs(CG.right-.5)>.08) warns.push(['',`Side-to-side imbalance: ${Math.round(CG.right*100)}% passenger side.`]);
  return {cost,wt,water,total,payload,solarW,ah,invW,alt,harvest,altWh,draw,usable,net,days,dark,fresh,grey,loads,byPhase,warns,score,waterDays};
}

function goPreset(p,instant){
  const c=C; view.preset=p; renderCams();

  doorAnim.rearT = p==='rear'?1:0; doorAnim.slideT = p==='side'?1:0;
  let pos,tgt; const Tm=c.T*IN;
  if(p==='ext'){ tgt=W(c.T*.48,c.f+c.H*.35,0); pos=tgt.clone().add(V3(Tm*.72,Tm*.38+.5,Tm*.9)); }
  else if(p==='rear'){ tgt=W(c.L*.45,c.f+c.H*.42,0); pos=W(-110,c.f+c.H*.75,14); }
  else if(p==='side'){ const xd=c.door?(c.door.x0+c.door.x1)/2:c.L*.55; tgt=W(xd-20,c.f+c.H*.42,-6); pos=W(xd+10,c.f+c.H*.7,c.W/2+110); }

   ===================================================================== */
const ray=new THREE.Raycaster(), mouse=new THREE.Vector2(); let down=null;
renderer.domElement.addEventListener('pointerdown',e=>{ down={x:e.clientX,y:e.clientY}; });
renderer.domElement.addEventListener('pointerup',e=>{
  if(!down) return; const moved=Math.hypot(e.clientX-down.x,e.clientY-down.y); down=null; if(moved>6) return;
  const r=renderer.domElement.getBoundingClientRect();
  mouse.set(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(mouse,camera);
  const hits=ray.intersectObjects(root.children,true);
  for(const h of hits){
    const o=h.object; if(!o.isMesh||o.userData.service) continue;
    if(!chainVisible(o)) continue;
    const L=o.userData.layer; if(L && view.layers[L]!=='solid') continue;
    if(o.userData.iid){ select(o.userData.iid); return; }
    break;
  }
  deselect();
});
function chainVisible(o){ while(o){ if(!o.visible) return false; o=o.parent; } return true; }
let popMode=null;
function select(iid){ view.sel=iid; popMode=null; selHelper.visible=true; renderPop(); }
function deselect(){ view.sel=null; selHelper.visible=false; $('#pop').hidden=true; }
function renderPop(){
  const inst=S.items.find(i=>i.iid===view.sel); if(!inst){deselect();return;}
  const it=ITEM[inst.cid], variants=ZONE[it.zone];

  if(popMode==='mat'){ for(const slot of it.mats||[]){ const cur=matOf(inst,slot); sub+=`<div class="sublbl">${SLOT_NAME[slot]}</div><div class="msw">${MATS[slot].map(([k,n])=>`<button data-ms="${slot}" data-mk="${k}" class="${k===cur?'on':''}"><img src="${swatch(k)}" alt=""><span>${n}</span></button>`).join('')}</div>`; } }
  $('#pop').innerHTML=`<div class="pop-h"><b>${it.name}</b><button class="x" data-a="close">✕</button></div>
    <div class="pop-meta">${fmt$(it.cost)} · ${it.wt} lb · Phase ${it.phase} ${it.draw?'· '+it.draw+' Wh/d':''}</div>
    <div class="pop-act">
      <button data-a="hide">👁 Hide Part</button>
      <button data-a="swap" ${variants.length<2?'disabled':''} class="${popMode==='swap'?'on':''}">⇄ Swap Variant</button>
      <button data-a="mat" ${it.mats?'':'disabled'} class="${popMode==='mat'?'on':''}">◐ Change Material</button>
      <button data-a="remove" class="danger">✕ Remove</button>
    </div><div class="pop-sub">${sub}</div>`;
  $('#pop').hidden=false; placePop();
}
$('#pop').addEventListener('click',e=>{
  const inst=S.items.find(i=>i.iid===view.sel); if(!inst) return;
  const a=e.target.closest('[data-a]');
  if(a){ const act=a.dataset.a;
    if(act==='close') deselect();
    else if(act==='hide'){ view.hidden.add(inst.iid); applyVisibility(); renderToolbar(); deselect(); toast(`Hidden · <b>Show Hidden</b> in toolbar restores it`); }

    return; }
  const v=e.target.closest('[data-var]'); if(v){ if(v.dataset.var!==inst.cid){ inst.cid=v.dataset.var; commit(); select(inst.iid); popMode='swap'; renderPop(); toast(`Swapped → <b>${ITEM[inst.cid].name}</b>`);} return; }
  const m=e.target.closest('[data-ms]'); if(m){ inst.mats=inst.mats||{}; inst.mats[m.dataset.ms]=m.dataset.mk; commit(); select(inst.iid); popMode='mat'; renderPop(); }

const _v=V3(0,0,0);
function placePop(){
  if(!view.sel || $('#pop').hidden) return;
  const g=instGroups.get(view.sel); if(!g) return;
  selBox.setFromObject(g);
  if(innerWidth<=860) return;
  _v.set((selBox.min.x+selBox.max.x)/2,selBox.max.y,(selBox.min.z+selBox.max.z)/2).project(camera);
  const r=vp.getBoundingClientRect(), pop=$('#pop');
  let x=(_v.x*.5+.5)*r.width+18, y=(-_v.y*.5+.5)*r.height-30;
  x=Math.min(Math.max(x,160),r.width-pop.offsetWidth-160); y=Math.min(Math.max(y,12),r.height-pop.offsetHeight-80);
  if(_v.z>1){ x=r.width/2-135; y=60; }
  pop.style.left=x+'px'; pop.style.top=y+'px';
}

function addItem(cid){
  const it=ITEM[cid]; const ex=S.items.find(i=>ITEM[i.cid].zone===it.zone);

  else { const inst={iid:uid(),cid,mats:{}}; S.items.push(inst); commit(); toast(`Added <b>${it.name}</b>`); }
  if(view.phase && it.phase>view.phase){ view.phase=0; applyVisibility(); renderPhases(); }
}
function removeInst(iid){

function bomRows(){ return [...S.items].sort((a,b)=>ITEM[a.cid].phase-ITEM[b.cid].phase).map(r=>{const it=ITEM[r.cid];return {phase:it.phase,phaseName:PHASES[it.phase],category:CATALOG.find(c=>c.id===it.cat).name,item:it.name,finishes:(it.mats||[]).map(s=>MATNAME[matOf(r,s)]).join(' / '),weight_lb:it.wt,cost_usd:it.cost};}); }
function exportCSV(){
  const q=s=>`"${String(s).replace(/"/g,'""')}"`;
  const rows=bomRows(), k=lastCalc;
  const csv=['Phase,Phase Name,Category,Item,Finishes,Weight (lb),Cost (USD)'].concat(rows.map(r=>[r.phase,q(r.phaseName),q(r.category),q(r.item),q(r.finishes),r.weight_lb,r.cost_usd].join(','))).concat([`,,,${q('TOTAL')},,${k.wt},${k.cost}`]).join('\n');
  exportText('Bill of Materials — CSV',csv,'Copy and paste into Sheets, Excel or Numbers.');
}
function buildJSON(){ const k=lastCalc; const v=C.v; return JSON.stringify({app:'NomadForge 3D',version:1,exported:new Date().toISOString(),build:S,
  summary:{vehicle:v.name,wheelbase:v.wbs[S.wbIdx].label,roof:v.roofs[S.roofIdx].label,cost_usd:k.cost,conversion_weight_lb:k.wt,total_added_lb:Math.round(k.total),payload_lb:k.payload,solar_w:k.solarW,battery_ah:k.ah,daily_harvest_wh:Math.round(k.harvest),daily_draw_wh:k.draw,autonomy_days:k.days===Infinity?'unlimited':+k.days.toFixed(1),fresh_gal:k.fresh,grey_gal:k.grey},bom:bomRows()},null,2); }
function exportJSON(){ exportText('Export Build — JSON',buildJSON(),'Save this text anywhere. Paste it into <b>Import</b> to restore the build on any device.'); }
function importDlg(){
  modal('Import Build',`<p class="muted" style="margin:0 0 10px;font-size:12px">Paste a NomadForge JSON export, or choose a .json file.</p><textarea id="imTxt" spellcheck="false" placeholder='{ "app": "NomadForge 3D", ... }'></textarea><input type="file" id="imFile" accept=".json,application/json" style="margin-top:10px;font-size:12px">`,
    `<button class="tb-btn" id="mCancel">Cancel</button><button class="tb-btn primary" id="mImport">Import</button>`);
  $('#mCancel').onclick=closeModal;
  $('#imFile').onchange=async e=>{ const f=e.target.files[0]; if(f) $('#imTxt').value=await f.text(); };
  $('#mImport').onclick=()=>{ try{ const o=JSON.parse($('#imTxt').value); const s=sanitize(o.build||o); if(!s) throw 0; loadState(s); closeModal(); toast(`Imported <b>${s.name}</b>`);}catch(e){ toast('That doesn’t look like a NomadForge build'); } };
}
function buildsDlg(){
  const list=load('nomadforge.builds')||{}; const names=Object.keys(list).sort((a,b)=>(list[b].t||0)-(list[a].t||0));
  const body = names.length ? `<div class="blist">${names.map(n=>{const b=list[n],v=VEHICLES[b.s.vehicle]; return `<div class="bitem"><div class="grow"><div>${n.replace(/</g,'&lt;')}</div><div>${v?v.name:''} · ${b.s.items.length} parts · ${new Date(b.t).toLocaleDateString()}</div></div><button class="tb-btn" data-load="${encodeURIComponent(n)}">Load</button><button class="x" data-del="${encodeURIComponent(n)}" title="Delete">✕</button></div>`;}).join('')}</div>`
    : `<p class="muted">No saved builds yet. Use <b>Save</b> to store the current configuration in this browser.</p>`;
  modal('Saved Builds',body+`<p class="muted" style="font-size:11px;margin:12px 0 0">Builds are stored in this browser only — use Export JSON to move them between devices.</p>`,`<button class="tb-btn" id="mNew">New build</button><button class="tb-btn" id="mImp">Import JSON</button><button class="tb-btn primary" id="mSaveAs">Save current</button>`);
  $('#mBody').onclick=e=>{ const l=e.target.closest('[data-load]'), d=e.target.closest('[data-del]');
    if(l){ const s=sanitize(list[decodeURIComponent(l.dataset.load)].s); if(s){ loadState(s); closeModal(); toast(`Loaded <b>${s.name}</b>`);} }
    if(d){ delete list[decodeURIComponent(d.dataset.del)]; store('nomadforge.builds',list); buildsDlg(); } };
  $('#mNew').onclick=()=>{ newBuild(); closeModal(); }; $('#mImp').onclick=importDlg; $('#mSaveAs').onclick=()=>{ saveBuild(); buildsDlg(); };
}
function saveBuild(){ const list=load('nomadforge.builds')||{}; list[S.name]={t:Date.now(),s:JSON.parse(JSON.stringify(S))}; if(store('nomadforge.builds',list)) toast(`Saved <b>${S.name}</b>`); else toast('Storage unavailable here — use Export JSON instead'); }
function newBuild(){ const s=freshState(); s.items=[]; s.name='New Build'; loadState(s); toast('Started a blank build'); }
function loadState(s){ S=s; paintMat.color.set(S.paint); view.hidden.clear(); deselect(); $('#buildName').value=S.name; commit(); goPreset(view.preset==='top'?'top':'ext'); }
$('#bSave').onclick=saveBuild; $('#bBuilds').onclick=buildsDlg; $('#bImport').onclick=importDlg; $('#bExport').onclick=exportJSON; $('#bNew').onclick=newBuild;
$('#buildName').value=S.name; $('#buildName').addEventListener('input',e=>{ S.name=e.target.value.slice(0,60)||'Untitled Build'; save(); });
$('#tL').onclick=()=>{ $('#main').classList.toggle('noL'); $('#tL').classList.toggle('on'); };
$('#tR').onclick=()=>{ $('#main').classList.toggle('noR'); $('#tR').classList.toggle('on'); };
// mobile nav
document.querySelectorAll('#mnav button').forEach(b=>b.onclick=()=>{
  const m=b.dataset.m, isOpen=b.classList.contains('on');
  document.querySelectorAll('#mnav button').forEach(x=>x.classList.remove('on')); $('#left').classList.remove('open'); $('#right').classList.remove('open');
  if(isOpen) return; b.classList.add('on');
  if(m==='tracker') $('#right').classList.add('open'); else { setTab(m); $('#left').classList.add('open'); }
});

/* =====================================================================
   SETTINGS · ABOUT · LATEST UPDATE
   ===================================================================== */
const APP = {
  version:'1.0.0', released:'Nov 16, 2026',
  repo:'https://github.com/mrsirwithpizza101/nomadforge-3d',
  get releases(){ return this.repo+'/releases/latest'; },
  about:'NomadForge 3D is an interactive 3D configurator and build planner for off-grid camper vans and overland rigs. Pick a base vehicle, snap modular interior and exterior components into place, try finishes in real time, and x-ray or explode the build to inspect hidden wiring, plumbing and clearances — while live trackers keep your cost, payload, power and water budgets honest.',
  latest:[
    'Six base platforms — Sprinter, Transit, ProMaster, pickup camper, skoolie and 4x4 box truck — with wheelbase, roof-height and paint options.',
    'A modular catalog of 45+ off-grid components that snap into zones and swap automatically when a zone is already occupied.',
    'X-ray and hide toggles for the body, roof, cab and walls reveal the routed wiring and plumbing behind them.',
    'Tap any part to hide it, swap its variant, change its material or remove it from the build.',
    'An exploded-view slider pulls racks, solar, walls and cabinetry outward to show how the layers fit together.',
    'Five animated camera presets (hotkeys 1–5) open the rear or side doors and switch to a top-down floor plan.',
    'Procedural finishes for cabinetry, countertops, walls and flooring can be applied build-wide or per part.',
    'A live tracker shows itemized cost, payload against GVWR, axle and side-to-side balance, solar vs. draw autonomy, and water capacity.',
    'Engineering checks flag problems like an undersized inverter, a missing grey tank or an overweight build.',
    'A Phase 1–4 build timeline steps through insulation, electrical, cabinetry and exterior gear in order.',
    'Builds can be saved in the browser and moved between devices with JSON import/export, plus a CSV bill of materials.',
  ],
};
function settingsDlg(){
  const hudOn = !$('#hud').hidden;
  modal('Settings',`
    <div class="set-sec"><h4>Display</h4>
      <label class="toggle" style="margin:0"><input type="checkbox" id="setHud" ${hudOn?'checked':''}> Show stats bar over the 3D view</label>
      <label class="toggle"><input type="checkbox" id="setGrid" ${view.grid?'checked':''}> Show floor grid</label>
      <label class="toggle"><input type="checkbox" id="setDims" ${view.dims?'checked':''}> Show dimension lines (in / cm)</label>
    </div>
    <div class="set-sec"><h4>About<span class="ver">v${APP.version}</span></h4>
      <p>${APP.about}</p>
      <div class="set-meta"><span>Version</span><span>${APP.version}</span><span>Released</span><span>${APP.released}</span><span>Source</span><span><a href="${APP.repo}" target="_blank" rel="noopener" style="color:var(--cyan)">GitHub</a></span></div>
    </div>
    <div class="set-sec"><h4>Latest Update<span class="ver">v${APP.version}</span></h4>
      <ul>${APP.latest.map(t=>`<li>${t}</li>`).join('')}</ul>
    </div>
    <a class="upd-btn" href="${APP.releases}" target="_blank" rel="noopener">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
      Check for Update</a>
    <div class="set-note">Opens the latest release on GitHub · you're on v${APP.version}</div>`,
    `<button class="tb-btn primary" id="setDone">Done</button>`);
  $('#setDone').onclick=closeModal;
  $('#setHud').onchange=e=>{ $('#hud').hidden=!e.target.checked; store('nomadforge.hud',e.target.checked); };
  $('#setGrid').onchange=e=>{ view.grid=e.target.checked; applyVisibility(); renderToolbar(); };
  $('#setDims').onchange=e=>{ view.dims=e.target.checked; applyVisibility(); renderToolbar(); };
}
$('#bSettings').onclick=settingsDlg;
if(load('nomadforge.hud')===false) $('#hud').hidden=true;

// keyboard
addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea,select')) return;
  const p=PRESETS.find(x=>x[2]===e.key); if(p){ goPreset(p[0]); return; }
  if(e.key==='Escape'){ deselect(); closeModal(); }
  if(e.key==='g') { view.grid=!view.grid; applyVisibility(); renderToolbar(); }
  if(e.key==='d') { view.dims=!view.dims; applyVisibility(); renderToolbar(); }
  if(e.key==='x') { view.layers.body=view.layers.body==='solid'?'ghost':'solid'; applyVisibility(); renderToolbar(); }
  if(view.sel && e.key==='h'){ view.hidden.add(view.sel); applyVisibility(); renderToolbar(); deselect(); }
  if(view.sel && (e.key==='Delete'||e.key==='Backspace')) removeInst(view.sel);
});

/* =====================================================================
   LOOP
   ===================================================================== */
function resize(){ const r=vp.getBoundingClientRect(); if(!r.width||!r.height) return; renderer.setSize(r.width,r.height,false); camera.aspect=r.width/r.height; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(vp);
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function loop(now){
  requestAnimationFrame(loop);
  if(tween){ const t=Math.min(1,(now-tween.s)/tween.d), k=ease(t); camera.position.lerpVectors(tween.p0,tween.p1,k); controls.target.lerpVectors(tween.t0,tween.t1,k); if(t>=1) tween=null; }
  controls.update();
  doorAnim.rear+= (doorAnim.rearT-doorAnim.rear)*.08; doorAnim.slide+=(doorAnim.slideT-doorAnim.slide)*.08;
  if(doorRefs.rear){ doorRefs.rear.l.rotation.y=-doorAnim.rear*1.85; doorRefs.rear.r.rotation.y=doorAnim.rear*1.85; }
  if(doorRefs.slide){ const s=doorAnim.slide; doorRefs.slide.g.position.set(-doorRefs.slide.len*Math.max(0,(s-.15)/.85), 0, 2.6*Math.min(1,s*5)); }
  if(doorRefs.okit) doorRefs.okit.position.x=-26*doorAnim.rear;
  exCur+=(view.explode-exCur)*.12; if(Math.abs(view.explode-exCur)<.0005) exCur=view.explode;
  for(const o of EXPL){ const e=o.userData.ex; o.position.set(e.base.x+e.v.x*exCur,e.base.y+e.v.y*exCur,e.base.z+e.v.z*exCur); }
  if(view.sel){ placePop(); selHelper.visible=true; }
  renderer.render(scene,camera);
}

/* =====================================================================
   INIT
   ===================================================================== */
resize();
commit(); renderCams(); renderPhases();
goPreset('ext',true);
requestAnimationFrame(loop);
setTimeout(()=>$('#loading').classList.add('gone'),150);
if(innerWidth<=860){ $('#main').classList.add('noL','noR'); }
