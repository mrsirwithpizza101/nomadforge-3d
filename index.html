<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>NomadForge 3D — Off-Grid Rig Configurator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#121417; --panel:#1E2228; --panel2:#252A31; --panel3:#2C323A; --line:#323941; --line2:#3b434d;
  --text:#E7EAEE; --muted:#8C95A1; --dim:#5f6873;
  --cyan:#2FD6EE; --cyan2:#1aa9bf; --amber:#F5B440; --red:#F27474; --green:#4ADE80;
  --mono:'JetBrains Mono',ui-monospace,monospace; --sans:'Inter',system-ui,-apple-system,sans-serif;
  --lw:280px; --rw:310px; --top:52px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:13px;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#363d46;border-radius:8px}::-webkit-scrollbar-track{background:transparent}

/* ---------- top bar ---------- */
#top{height:var(--top);display:flex;align-items:center;gap:12px;padding:0 12px;background:#16191D;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:.14em;font-size:13px;white-space:nowrap}
.brand b{color:var(--cyan);font-weight:700}
.brand svg{flex:none}
#buildName{background:transparent;border:1px solid transparent;border-radius:6px;padding:6px 8px;min-width:0;width:220px;font-weight:500;color:var(--text)}
#buildName:hover{border-color:var(--line)}#buildName:focus{outline:none;border-color:var(--cyan2);background:var(--panel)}
.spacer{flex:1}
.tb-btn{height:32px;padding:0 11px;border-radius:7px;border:1px solid var(--line);background:var(--panel);display:inline-flex;align-items:center;gap:6px;font-weight:500;white-space:nowrap;transition:.15s}
.tb-btn:hover{border-color:var(--line2);background:var(--panel2)}
.tb-btn.primary{background:var(--cyan);color:#062028;border-color:var(--cyan);font-weight:600}
.tb-btn.primary:hover{filter:brightness(1.08)}
.tb-btn.icon{width:32px;padding:0;justify-content:center}
.tb-btn.on{border-color:var(--cyan2);color:var(--cyan)}

/* ---------- layout ---------- */
main{display:grid;grid-template-columns:var(--lw) 1fr var(--rw);height:calc(100dvh - var(--top));transition:grid-template-columns .25s}
main.noL{--lw:0px} main.noR{--rw:0px}
aside{background:var(--panel);overflow:hidden;display:flex;flex-direction:column;min-width:0}
#left{border-right:1px solid var(--line)} #right{border-left:1px solid var(--line)}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;padding:12px 4px;font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid transparent}
.tabs button.on{color:var(--text);border-bottom-color:var(--cyan)}
.pane{overflow:auto;flex:1;padding:12px}
.pane[hidden]{display:none}
.h{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:14px 2px 8px}
.h:first-child{margin-top:2px}
.muted{color:var(--muted)} .mono{font-family:var(--mono)}

/* vehicle cards */
.vcard{width:100%;text-align:left;padding:10px 11px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);margin-bottom:7px;display:flex;gap:10px;align-items:center;transition:.15s}
.vcard:hover{border-color:var(--line2)}
.vcard.on{border-color:var(--cyan);box-shadow:inset 3px 0 0 var(--cyan)}
.vcard svg{flex:none;opacity:.85}
.vcard .t{font-weight:600}.vcard .s{font-size:11px;color:var(--muted);margin-top:2px}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:3px;gap:3px}
.seg button{flex:1;padding:7px 4px;border-radius:6px;font-weight:500;font-size:12px;color:var(--muted)}
.seg button.on{background:var(--panel3);color:var(--text);box-shadow:0 0 0 1px var(--line2)}
.swatches{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line2);cursor:pointer}
.sw.on{box-shadow:0 0 0 2px var(--cyan)}
.sw input{opacity:0;width:100%;height:100%;cursor:pointer}
.spec{display:grid;grid-template-columns:1fr auto;gap:5px 10px;font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 11px}
.spec span:nth-child(even){font-family:var(--mono);text-align:right}

/* catalog */
details.cat{border:1px solid var(--line);border-radius:9px;margin-bottom:8px;background:var(--panel2);overflow:hidden}
details.cat summary{list-style:none;padding:10px 11px;cursor:pointer;display:flex;align-items:center;gap:8px;font-weight:600}
details.cat summary::-webkit-details-marker{display:none}
details.cat summary .cnt{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--cyan);background:rgba(47,214,238,.1);padding:1px 7px;border-radius:10px}
details.cat summary .chev{transition:.2s;color:var(--muted)}
details.cat[open] summary .chev{transform:rotate(90deg)}
.item{display:flex;align-items:center;gap:8px;padding:8px 11px;border-top:1px solid var(--line);cursor:pointer;transition:background .12s}
.item:hover{background:var(--panel3)}
.item .nm{font-weight:500;line-height:1.25}
.item .mt{font-size:11px;color:var(--muted);font-family:var(--mono);margin-top:2px}
.item .st{margin-left:auto;flex:none;display:flex;gap:4px;align-items:center}
.item.in{box-shadow:inset 3px 0 0 var(--cyan)}
.item.in .nm{color:var(--cyan)}
.tag{font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:2px 6px;border-radius:5px}
.tag.swap{color:var(--amber);background:rgba(245,180,64,.12)}
.tag.ok{color:var(--cyan);background:rgba(47,214,238,.12)}
.x{width:22px;height:22px;border-radius:5px;color:var(--muted);display:grid;place-items:center}
.x:hover{background:rgba(242,116,116,.15);color:var(--red)}

/* finishes */
.mats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.mat{border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--panel2);text-align:left;transition:.15s}
.mat:hover{border-color:var(--line2)}
.mat.on{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan)}
.mat img{display:block;width:100%;height:46px;object-fit:cover}
.mat span{display:block;padding:6px 8px;font-size:11px;font-weight:500;line-height:1.25}

/* ---------- viewport ---------- */
#vp{position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 35%,#1b1f25 0%,#121417 70%)}
#vp canvas{display:block;width:100%;height:100%;outline:none;touch-action:none}
.glass{background:rgba(24,27,32,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:10px}
#toolbar{position:absolute;left:12px;top:12px;display:flex;flex-direction:column;gap:6px;padding:7px;z-index:5;max-height:calc(100% - 110px);overflow:auto}
.tgl{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 8px;border-radius:7px;min-width:132px;font-weight:500;font-size:12px}
.tgl:hover{background:var(--panel3)}
.mode{font-family:var(--mono);font-size:10px;font-weight:600;padding:2px 6px;border-radius:4px;letter-spacing:.04em}
.mode.solid{color:#c8cfd8;background:#2f363f}.mode.ghost{color:var(--cyan);background:rgba(47,214,238,.13)}.mode.hidden{color:var(--dim);background:#1a1d22;text-decoration:line-through}
.mode.on{color:var(--amber);background:rgba(245,180,64,.13)}.mode.off{color:var(--dim);background:#1a1d22}
.tsep{height:1px;background:var(--line);margin:2px 4px}
.tbl{font-size:10px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;font-weight:600;padding:2px 8px 0}
#cams{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:3px;padding:6px;z-index:5}
#cams button{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 8px;border-radius:7px;font-size:12px;font-weight:500;text-align:left}
#cams button:hover{background:var(--panel3)}
#cams button.on{color:var(--cyan)}
kbd{font-family:var(--mono);font-size:10px;padding:1px 5px;border-radius:4px;background:#2b3138;color:var(--muted);border:1px solid #39414a}
#hud[hidden]{display:none !important}
#hud{position:absolute;left:50%;top:12px;transform:translateX(-50%);display:flex;gap:2px;padding:4px;z-index:4}
.chip{padding:5px 10px;border-radius:7px;display:flex;flex-direction:column;align-items:center;min-width:76px}
.chip b{font-family:var(--mono);font-size:13px;font-weight:600}
.chip small{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.chip.warn b{color:var(--amber)}.chip.bad b{color:var(--red)}.chip.good b{color:var(--green)}
#bottom{position:absolute;left:12px;right:12px;bottom:12px;display:flex;gap:10px;z-index:5;align-items:stretch}
#phaseBar{flex:1;display:flex;align-items:center;gap:6px;padding:7px;min-width:0;overflow-x:auto}
.ph{display:flex;align-items:center;gap:7px;padding:6px 10px;border-radius:7px;white-space:nowrap;font-size:12px;font-weight:500;color:var(--muted);border:1px solid transparent}
.ph .n{font-family:var(--mono);width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:#2a3037;font-size:10px;color:var(--muted)}
.ph:hover{background:var(--panel3)}
.ph.on{color:var(--text);border-color:var(--line2);background:var(--panel2)}
.ph.on .n,.ph.done .n{background:var(--amber);color:#2a1a00}
.ph.done{color:#c9ced6}
.arrow{color:var(--dim);flex:none}
#explodeBox{display:flex;align-items:center;gap:10px;padding:7px 12px;flex:none;width:280px}
#explodeBox label{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--cyan) var(--p,0%),#323941 var(--p,0%));outline:none;min-width:60px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--cyan);cursor:pointer}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--cyan);cursor:pointer}
#explodeVal{font-family:var(--mono);font-size:12px;width:36px;text-align:right;color:var(--cyan)}
#pop{position:absolute;z-index:8;width:270px;padding:0;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.45)}
#pop[hidden]{display:none}
.pop-h{display:flex;align-items:flex-start;gap:8px;padding:11px 12px 6px}
.pop-h b{font-size:13px;line-height:1.3}
.pop-h .x{margin-left:auto;flex:none}
.pop-meta{padding:0 12px 10px;font-family:var(--mono);font-size:11px;color:var(--muted)}
.pop-act{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-top:1px solid var(--line)}
.pop-act button{background:#1b1f24;padding:9px 6px;font-size:12px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:6px}
.pop-act button:hover:not(:disabled){background:var(--panel3)}
.pop-act button:disabled{color:#4b535d;cursor:default}
.pop-act button.on{color:var(--cyan)}
.pop-act .danger{color:var(--red)}
.pop-sub{border-top:1px solid var(--line);padding:10px 12px;max-height:240px;overflow:auto}
.pop-sub:empty{display:none}
.vrow{display:flex;justify-content:space-between;gap:8px;width:100%;padding:7px 8px;border-radius:6px;text-align:left;font-size:12px}
.vrow:hover{background:var(--panel3)}.vrow.on{color:var(--cyan)}
.vrow span:last-child{font-family:var(--mono);color:var(--muted);font-size:11px}
.msw{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.msw button{border:1px solid var(--line);border-radius:6px;overflow:hidden;padding:0}
.msw button.on{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan)}
.msw img{width:100%;height:30px;display:block;object-fit:cover}
.msw span{display:block;font-size:10px;padding:3px 4px;line-height:1.2;text-align:left}
.sublbl{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:2px 0 6px}
#loading{position:absolute;inset:0;display:grid;place-items:center;z-index:20;background:var(--bg);color:var(--muted);font-family:var(--mono);font-size:12px;letter-spacing:.1em;transition:opacity .4s}
#loading.gone{opacity:0;pointer-events:none}

/* ---------- tracker ---------- */
.card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.card h3{margin:0 0 10px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:8px}
.card h3 .r{margin-left:auto;text-transform:none;letter-spacing:0;font-family:var(--mono);color:var(--text);font-size:12px}
.big{font-family:var(--mono);font-size:24px;font-weight:600;letter-spacing:-.02em}
.big small{font-size:12px;color:var(--muted);font-weight:500;margin-left:4px}
.bar{height:8px;border-radius:5px;background:#15181c;overflow:hidden;position:relative;margin:8px 0 4px}
.bar>i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--cyan);transition:width .4s}
.row{display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:3px 0}
.row span:last-child{font-family:var(--mono)}
.row.sub{color:var(--muted);font-size:11.5px}
.warns{margin-top:8px;display:flex;flex-direction:column;gap:5px}
.warn{font-size:11.5px;line-height:1.35;padding:7px 9px;border-radius:7px;background:rgba(245,180,64,.08);border:1px solid rgba(245,180,64,.25);color:#f3cf8a}
.warn.bad{background:rgba(242,116,116,.08);border-color:rgba(242,116,116,.3);color:#f5a9a9}
.ctl{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);margin-top:6px}
.ctl span:first-child{width:92px;flex:none}.ctl b{font-family:var(--mono);color:var(--text);font-weight:500;width:46px;text-align:right;flex:none}
.score{display:flex;align-items:center;gap:12px}
.ring{flex:none}
.pbars{display:flex;gap:3px;height:34px;align-items:flex-end;margin:6px 0 2px}
.pbars div{flex:1;border-radius:3px 3px 0 0;background:var(--amber);min-height:2px;opacity:.85}
.plbl{display:flex;gap:3px}.plbl span{flex:1;text-align:center;font-family:var(--mono);font-size:10px;color:var(--muted)}
table.bom{width:100%;border-collapse:collapse;font-size:11.5px}
.bom th{text-align:left;font-weight:600;color:var(--muted);font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:4px 3px;border-bottom:1px solid var(--line)}
.bom td{padding:5px 3px;border-bottom:1px solid #2a3037;vertical-align:top}
.bom td.n{font-family:var(--mono);text-align:right;white-space:nowrap}
.bom th.n{text-align:right}
.bom tr.ph td{color:var(--amber);font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;padding-top:9px}
.bom tr.tot td{font-weight:600;border-bottom:0;padding-top:8px}
.btnrow{display:flex;gap:6px;margin-top:10px}
.btnrow .tb-btn{flex:1;justify-content:center;height:30px;font-size:12px}
.toggle{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);cursor:pointer;margin-top:6px}
.toggle input{accent-color:var(--cyan)}

/* ---------- modal & toast ---------- */
#modal{position:fixed;inset:0;background:rgba(5,7,9,.6);display:grid;place-items:center;z-index:50;padding:16px}
#modal[hidden]{display:none}
.mbox{width:min(560px,100%);max-height:86dvh;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line2);border-radius:12px;box-shadow:0 30px 70px rgba(0,0,0,.5)}
.mhead{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);font-weight:600}
.mhead .x{margin-left:auto}
.mbody{padding:14px 16px;overflow:auto}
.mbody textarea{width:100%;min-height:220px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;font-family:var(--mono);font-size:11.5px;resize:vertical;color:#cfd6de}
.mfoot{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.blist{display:flex;flex-direction:column;gap:6px}
.bitem{display:flex;align-items:center;gap:8px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel2)}
.bitem .grow{flex:1;min-width:0}.bitem .grow div:last-child{font-size:11px;color:var(--muted);font-family:var(--mono);margin-top:2px}
#toast{position:fixed;left:50%;top:76px;transform:translate(-50%,-10px);opacity:0;background:#0f1215;border:1px solid var(--line2);padding:9px 14px;border-radius:9px;font-size:12.5px;z-index:60;transition:.25s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast b{color:var(--cyan);font-weight:600}

#mnav{display:none}
.vmodes{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;padding:2px 2px 0}
.vm{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px 6px;border-radius:7px;font-size:10.5px;font-weight:600;color:var(--muted);border:1px solid transparent}
.vm:hover{background:var(--panel3);color:var(--text)}
.vm.on{background:rgba(47,214,238,.1);border-color:rgba(47,214,238,.45);color:var(--cyan)}
.tip{font-size:11px;line-height:1.4;color:var(--muted);padding:2px 6px 4px;max-width:236px}
.tgl.lt{font-size:11.5px;color:var(--muted);padding:5px 6px}
.lrows{display:flex;flex-direction:column;gap:5px;padding:0 4px 4px}
.lrow{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11.5px}
.seg3{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px;gap:2px}
.seg3 button{font-size:10px;font-weight:600;padding:3px 6px;border-radius:4px;color:var(--muted)}
.seg3 button.on{background:var(--panel3);color:var(--cyan)}
.chips{display:flex;gap:4px;padding:0 2px}
.chip2{flex:1;padding:6px 6px;border-radius:7px;font-size:11px;font-weight:600;color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.chip2:hover{color:var(--text)} .chip2.on{color:var(--amber);border-color:rgba(245,180,64,.4);background:rgba(245,180,64,.08)}
#toolbar{width:248px}
.search{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:0 10px;margin-bottom:8px;color:var(--muted)}
.search:focus-within{border-color:var(--cyan2)}
.search input{flex:1;background:none;border:0;outline:none;padding:10px 0;font-size:13px;min-width:0}
.qres{border:1px solid var(--line);border-radius:9px;background:var(--panel2);padding:6px 0 10px;margin-bottom:8px}
.qres .sublbl{padding:4px 11px 0}
.qonline{display:block;width:calc(100% - 22px);margin:8px 11px 0;padding:9px;border-radius:8px;border:1px dashed var(--line2);color:var(--cyan);font-weight:600;font-size:12px}
.qonline:hover{background:rgba(47,214,238,.06)}
#qWeb{padding:0 11px}
.webnote{font-size:11.5px;color:var(--muted);line-height:1.45;margin-top:10px}
.webcard{border-top:1px solid var(--line);padding:10px 0 2px;margin-top:8px}
.webcard .wt{color:var(--text);font-weight:600;font-size:12.5px;text-decoration:none;line-height:1.3;display:block}
.webcard .wh{font-size:10.5px;color:var(--cyan);font-family:var(--mono);margin:2px 0 4px}
.webcard .ws{font-size:11.5px;color:var(--muted);line-height:1.4}
.wchips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.wchips span{font-family:var(--mono);font-size:10.5px;padding:2px 6px;border-radius:5px;background:rgba(245,180,64,.1);color:var(--amber)}
.addc{width:100%;padding:9px;border-radius:9px;border:1px dashed var(--line2);color:var(--muted);font-weight:600;font-size:12px;margin-bottom:10px}
.addc:hover{color:var(--cyan);border-color:var(--cyan2)}
.item .grow{flex:1;min-width:0}

   ===================================================================== */
function disposeTree(o){ o.traverse(n=>{ if(n.geometry) n.geometry.dispose(); if(n.isSprite){n.material.map?.dispose();n.material.dispose();} }); }

  c.parentMap={};

    const it=IT(inst), g=new THREE.Group(), before=Object.assign({},c.ports);
    root.add(g);

    g.updateMatrixWorld(true); const cb=groupBox(g); root.remove(g);

    const w=new THREE.Group(); w.userData={iid:inst.iid,wrap:true,c0,inner:g};
    const off=Object.assign({x:0,y:0,z:0,r:0},inst.pos||{});

  if(view.sel && !instGroups.has(view.sel)) deselect(); else if(view.sel) selDimsDirty=true;
  // interior light

const EXDIR = {solar:[0,115,0],rack:[0,92,0],fan:[0,72,0],ac:[0,78,0],awning:[0,30,60],carrier:[-45,0,0],armor:[45,0,0],shore:[0,0,-50],grey:[0,-30,0],
  okit:[-28,0,8],oshower:[-18,0,10],sink:[0,16,0],cook:[0,22,0],swivel:[16,0,0],hydronic:[0,-6,0],heater:[10,0,12],dcdc:[0,8,-10],inverter:[0,8,-12],battery:[0,0,-14],fresh:[0,0,-16]};

let camSide=1;
const MODE_LAYERS={exterior:{body:'solid',roof:'solid',cab:'solid',walls:'solid'},xray:{body:'ghost',roof:'ghost',cab:'ghost',walls:'ghost'},
  interior:{body:'hidden',roof:'hidden',cab:'ghost',walls:'solid'},cutaway:{body:'solid',roof:'hidden',cab:'solid',walls:'solid'}};
function effMode(o){
  const Lr=o.userData.layer, m=view.mode;
  if(m==='custom') return view.layers[Lr];
  if(m!=='cutaway') return MODE_LAYERS[m][Lr];
  const sd=o.userData.side;

  if(sd!==undefined && sd===camSide) return 'hidden';
  return 'solid';
}
function phaseOK(it){ return !view.phase || it.phase<=view.phase; }
function applyVisibility(){
  root.traverse(o=>{
    const Lr=o.userData.layer; if(!Lr) return;
    if(o.userData.edge){ o.visible = !!o.parent && effMode(o.parent)==='ghost'; return; }
    if(!o.isMesh) return;
    const mode=effMode(o);
    o.visible = mode!=='hidden';
    o.material = mode==='ghost' ? (Lr==='walls'?ghostMatW:ghostMat) : o.userData.solid;
    o.castShadow = mode==='solid';
  });
  for(const inst of S.items){ const g=instGroups.get(inst.iid); if(!g) continue; const st=statusOf(inst);
    g.visible = !view.hidden.has(inst.iid) && phaseOK(IT(inst)) && !(view.statusView==='owned'&&st==='need');
    const gh = view.statusView==='ghost'&&st==='need';
    g.userData.inner.traverse(o=>{ if(o.isMesh&&o.userData.iid===inst.iid&&!o.userData.layer&&o.userData.mat0) o.material=gh?ghostPlan:o.userData.mat0; }); }
  if(servicesGroup) servicesGroup.visible = !view.phase || view.phase>=2;
  if(dimsGroup) dimsGroup.visible = view.dims;
  grid.visible=gridFine.visible=view.grid;
  if(view.sel){ const g=instGroups.get(view.sel); if(!g||!g.visible) deselect(); }
}
function updateCamSide(){
  if(!C || view.mode!=='cutaway') return;
  const cx=(C.L/2-C.T/2)*IN, dx=(camera.position.x-cx)/IN, dz=camera.position.z/IN;
  const ns=(dx<-(C.L/2+12) && Math.abs(dx)>Math.abs(dz)*1.1) ? 'rear' : (dz<0?-1:1);
  if(ns!==camSide){ camSide=ns; applyVisibility(); }
}

  for(const inst of items){ const it=IT(inst);
    cost+=it.cost; wt+=it.wt; byPhase[it.phase]+=it.cost; solarW+=it.solarW||0; ah+=it.ah||0; invW=Math.max(invW,it.invW||0); alt+=it.altA||0;
    fresh+=it.fresh||0; grey+=it.grey||0; if(it.draw) loads.push([it.name.replace(/ \(.*\)/,''),it.draw]); }
  if(ah) loads.push(['Phones, laptop, pump & misc.',180]);
  const water = st.fullWater? fresh*8.34 : 0;
  const payload = c.gvwr - c.curb;
  const total = wt + water + (+st.cargo||0);
  const harvest = solarW*st.sunHours*.75, altWh = alt*13.8*st.driveHours, draw = loads.reduce((a,l)=>a+l[1],0);
  const usable = ah*12.8*.9, net = harvest+altWh-draw;
  const days = !ah ? 0 : draw<=0 ? Infinity : net>=0 ? Infinity : usable/(-net);
  const dark = ah&&draw? usable/draw : 0;
  const waterDays = fresh/3;
  const pScore = days===Infinity? 60 : Math.min(60, days/7*60), wScore = Math.min(40, waterDays/7*40);
  const score = Math.round((ah?pScore:0)+wScore);
  const warns=[];
  const has=z=>c.has(z), cid=z=>has(z)?.cid;
  if(total>payload) warns.push(['bad',`Over payload by ${fmtN(total-payload)} lb — exceeds GVWR of ${fmtN(c.gvwr)} lb.`]); else if(total>payload*.85) warns.push(['',`Within 15% of payload capacity (${fmtN(payload-total)} lb left).`]);
  if(cid('cook')==='induction' && invW<1800) warns.push(['bad','Induction cooktop needs an inverter of at least 1800 W.']);
  if(has('ac') && invW<3000) warns.push(['bad','Rooftop A/C needs the 3000 W inverter.']);
  if(has('ac') && ah<400) warns.push(['','A/C on battery really wants 400 Ah or more.']);
  if((solarW||invW||alt) && !ah) warns.push(['bad','Solar / inverter / DC-DC installed with no battery bank.']);
  if((has('sink')||c.bath||has('oshower')) && !fresh) warns.push(['','Water fixtures installed but no fresh water tank.']);
  if((has('sink')||c.bath) && !grey) warns.push(['','No grey tank — sink/shower drain has nowhere to go.']);
  if(has('ac') && cid('solar')==='solar800' && c.roofEndX < (c.solarRows||0)*60+44) warns.push(['','Roof is crowded: 800 W array overlaps the A/C footprint.']);
  if(has('galleyP') && has('galleyD') && c.kind==='pickup') warns.push(['','Two galleys in a truck camper leaves little aisle.']);
  if(CG.w && Math.abs(CG.right-.5)>.08) warns.push(['',`Side-to-side imbalance: ${Math.round(CG.right*100)}% passenger side.`]);
  return {cost,wt,water,total,payload,solarW,ah,invW,alt,harvest,altWh,draw,usable,net,days,dark,fresh,grey,loads,byPhase,warns,score,waterDays};
}

/* ---------- part search ---------- */
const STOP=new Set(['the','a','an','for','with','and','of','to','in','on','van','camper','kit','set','new','best','rv']);
function tokens(s){ return s.toLowerCase().replace(/[^a-z0-9.\s/-]/g,' ').split(/[\s/-]+/).filter(t=>t&&!STOP.has(t)); }
function numHints(q){ const out={}, re=/(\d+(?:\.\d+)?)\s*(ah|amp ?hours?|kw|w|watts?|l|liters?|litres?|gal|gallons?|qt)\b/gi; let m;
  while((m=re.exec(q))){ const v=+m[1], u=m[2].toLowerCase(); if(u==='ah'||u.startsWith('amp')) out.ah=v; else if(u==='kw') out.w=v*1000; else if(u[0]==='w') out.w=v; else if(u[0]==='l') out.l=v; else if(u.startsWith('gal')) out.gal=v; else if(u==='qt') out.l=v*.946; }
  return out; }
function guessCat(q){ const s=q.toLowerCase();
  if(/batter|solar|inverter|charger|mppt|controller|volt|amp|fuse|bus ?bar|wire|cable|shunt|monitor|outlet|usb/.test(s)) return 'power';
  if(/toilet|shower|bath/.test(s)) return 'bath';
  if(/water|tank|pump|filter|heater|furnace|fan|vent|a\/?c\b|air con|cool/.test(s)) return 'water';
  if(/stove|cook|sink|faucet|fridge|refrig|freezer|oven|microwave|counter|cabinet|drawer|kitchen|kettle/.test(s)) return 'kitchen';
  if(/bed|mattress|seat|bench|cushion|table/.test(s)) return 'sleep';
  if(/rack|awning|ladder|bumper|tire|bike|winch|light ?bar|carrier|box|skid|recovery|maxtrax/.test(s)) return 'ext';
  if(/insulat|panel|floor|wall|ceiling|plywood/.test(s)) return 'shell';
  return null; }
function searchParts(q){
  const tk=tokens(q).filter(t=>!/^\d/.test(t)), nh=numHints(q), scored=[], bare=(q.match(/(?<![\w.])\d{2,4}(?![\w.])/g)||[]).map(Number);
  for(const it of Object.values(ITEM)){
    const name=it.name.toLowerCase(), kwl=(it.kw||'').toLowerCase(), kws=kwl.split(/\s+/); let s=0, nameHit=0, kwHit=0;
    for(const t of tk){ if(name.includes(t)){s+=3;nameHit++;} else if(kws.includes(t)){s+=2.5;kwHit++;} else if(t.length>3&&(kwl.includes(t)||name.includes(t.slice(0,5)))){s+=1;kwHit++;} }
    if(s>0||Object.keys(nh).length){
      if(nh.ah&&it.ah) s+=3-Math.min(3,Math.abs(it.ah-nh.ah)/150);
      if(nh.w&&it.solarW&&!/inverter|charger/i.test(q)) s+=3-Math.min(3,Math.abs(it.solarW-nh.w)/200);
      if(nh.w&&it.invW&&(/inverter|charger/i.test(q)||nh.w>=1500)) s+=3-Math.min(3,Math.abs(it.invW-nh.w)/700);
      if(nh.l&&it.liters) s+=3-Math.min(3,Math.abs(it.liters-nh.l)/30);
      if(nh.gal&&it.fresh) s+=3-Math.min(3,Math.abs(it.fresh-nh.gal)/15);
    }
    if(s>0) for(const n of bare){ for(const v of [it.ah,it.solarW,it.invW,it.liters,it.fresh]) if(v && Math.abs(v-n)/v<.16){ s+=2.2; break; } }
    if(s>0) scored.push({it,s,viaKw:!nameHit&&kwHit>0});
  }
  scored.sort((a,b)=>b.s-a.s);
  const best=scored[0]?.s||0;
  let exact=scored.filter(r=>r.s>=Math.max(3,best*.6)).slice(0,5);
  let closest=exact.length?[]:scored.slice(0,3);
  if(!exact.length&&!closest.length){ const gc=guessCat(q); if(gc) closest=Object.values(ITEM).filter(i=>i.cat===gc).slice(0,3).map(it=>({it,s:0,viaKw:true})); }
  return {exact,closest};
}
function renderSearch(){
  const box=$('#qRes'); if(!box) return; const q=qText.trim();
  if(!q){ box.innerHTML=''; return; }
  const r=searchParts(q);
  let h='<div class="qres">';
  if(r.exact.length) h+=`<div class="sublbl">In the catalog</div>`+r.exact.map(x=>itemRow(x.it,x.viaKw?['swap','≈ closest']:null)).join('');
  if(r.closest.length) h+=`<div class="sublbl">Closest match in the catalog</div>`+r.closest.map(x=>itemRow(x.it,['swap','≈ closest'])).join('');
  if(!r.exact.length&&!r.closest.length) h+=`<div class="muted" style="padding:8px 2px;font-size:12px">No close match in the catalog.</div>`;
  h+=`<button class="qonline" id="qOnline">🌐 Search online for “${esc(q)}”</button><div id="qWeb"></div></div>`;
  box.innerHTML=h;
}

  }catch(e){}

function extractSpecs(text){
  const s={}, t=text.replace(/(\d),(\d{3})/g,'$1$2'); let m;
  if((m=t.match(/\$\s?(\d{1,5}(?:\.\d{2})?)/))) s.cost=+m[1];
  if((m=t.match(/(\d+(?:\.\d+)?)\s?(?:lbs?|pounds)\b/i))) s.wt=+m[1]; else if((m=t.match(/(\d+(?:\.\d+)?)\s?kg\b/i))) s.wt=Math.round(+m[1]*22.046)/10;
  if((m=t.match(/(\d+(?:\.\d+)?)\s?(?:"|in(?:ch(?:es)?)?)?\s?[x×*]\s?(\d+(?:\.\d+)?)\s?(?:"|in(?:ch(?:es)?)?)?\s?[x×*]\s?(\d+(?:\.\d+)?)\s?("|in(?:ch(?:es)?)?|cm|mm)?/i))){
    const u=(m[4]||'in').toLowerCase(), k=u==='cm'?1/2.54:u==='mm'?1/25.4:1; [s.w,s.d,s.h]=[m[1],m[2],m[3]].map(v=>Math.round(+v*k*10)/10); }
  if((m=t.match(/(\d+(?:\.\d+)?)\s?ah\b/i))) s.ah=+m[1];
  if((m=t.match(/(\d{2,5})\s?w(?:att)?s?\b/i))) s.watts=+m[1];
  if((m=t.match(/(\d+(?:\.\d+)?)\s?(?:gal|gallons?)\b/i))) s.gal=+m[1];
  return s;
}
const PLACE_BY_CAT={power:'underbed',water:'driver',kitchen:'driver',sleep:'aisle',bath:'passenger',ext:'roof',storage:'aisle',shell:'aisle',other:'aisle'};
function prefillFrom(q,web){
  const r=searchParts(q), base=(r.exact[0]||r.closest[0]||{}).it, sp=web?extractSpecs(web.title+' '+web.snippet):extractSpecs(q);
  const cat=guessCat(q)||base?.cat||'other';
  const out={name:(web?web.title:q).replace(/\s*[|–-]\s*[^|–-]*$/,'').slice(0,60)||q,cat,place:PLACE_BY_CAT[cat]||'aisle',phase:base?.phase||3,url:web?.url||''};
  const bz=base?.sz||[12,12,12];
  out.w=sp.w??bz[0]; out.d=sp.d??bz[1]; out.h=sp.h??bz[2];
  out.wt=sp.wt??base?.wt??10; out.cost=sp.cost??base?.cost??100;
  out.ah=sp.ah??0; out.draw=base?.draw||0; out.solarW=/solar/i.test(q)?(sp.watts||base?.solarW||0):0; out.fresh=/fresh|water tank/i.test(q)?(sp.gal||base?.fresh||0):0; out.grey=/gr[ae]y/i.test(q)?(sp.gal||16):0;
  return out;
}
async function onlineSearch(q){
  const box=$('#qWeb'); if(!box||!q) return;
  const ddg='https://duckduckgo.com/?q='+encodeURIComponent(q);
  const fallback=msg=>{ box.innerHTML=`<div class="webnote">${msg}</div><div class="btnrow"><a class="tb-btn" href="${ddg}" target="_blank" rel="noopener">Open web search ↗</a><button class="tb-btn primary" data-fq="1">Add as custom part</button></div>`; };
  if(!isNative()){ fallback('Live web results load inside the Android app. Here, open the search in your browser, then add the part with the specs you find.'); return; }
  box.innerHTML='<div class="webnote">Searching the web…</div>';
  try{
    const res=await webSearch(q); if(!res.length) throw new Error('none'); lastWeb=res;
    box.innerHTML=`<div class="sublbl">Web results</div>`+res.map((r,i)=>{ const sp=extractSpecs(r.title+' '+r.snippet), chips=[];
      if(sp.cost) chips.push(fmt$(sp.cost)); if(sp.wt) chips.push(sp.wt+' lb'); if(sp.w) chips.push(sizeTxt([sp.w,sp.d,sp.h])); if(sp.ah) chips.push(sp.ah+' Ah'); if(sp.watts) chips.push(sp.watts+' W'); if(sp.gal) chips.push(sp.gal+' gal');
      let host=''; try{host=new URL(r.url).hostname.replace(/^www\./,'');}catch(e){}
      const near=(searchParts(r.title).exact[0]||searchParts(r.title).closest[0]||{}).it;
      return `<div class="webcard"><a href="${esc(r.url)}" target="_blank" rel="noopener" class="wt">${esc(r.title)}</a><div class="wh">${esc(host)}</div><div class="ws">${esc(r.snippet.slice(0,170))}</div>
        ${chips.length?`<div class="wchips">${chips.map(c=>`<span>${esc(c)}</span>`).join('')}</div>`:''}
        <div class="btnrow"><button class="tb-btn primary" data-wi="${i}">Add as custom part</button>${near?`<button class="tb-btn" data-add="${near.id}" title="${esc(near.name)}">Use closest: ${esc(near.name.length>22?near.name.slice(0,21)+'…':near.name)}</button>`:''}</div></div>`; }).join('');
  }catch(e){ fallback('Couldn’t reach the web just now. Check your connection, or add the part manually.'); }
}

/* ---------- automate (cluster arrange) ---------- */
let autoState=null; const STRATS=[['compact','Compact — tight against the wall'],['balanced','Balanced — heavy parts low, centered between the axles'],['spread','Spread out — even spacing']];
const AREAS=[['driver','Driver side'],['passenger','Passenger side'],['rear','Rear'],['center','Middle'],['all','Whole floor']];
function autoArrange(area){
  const c=C; const ids=[...new Set([...(MV?[MV.iid]:[]),...cluster])].filter(id=>{ const i=S.items.find(x=>x.iid===id); return i&&mountOf(i)==='floor'&&!c.parentMap[id]; });
  if(!ids.length){ toast('Add floor parts to the cluster first'); return; }
  if(!autoState||autoState.area!==area) autoState={area,k:0}; else autoState.k=(autoState.k+1)%STRATS.length;
  const strat=STRATS[autoState.k][0];
  const A={driver:[0,c.L,-c.zi,-c.zi+c.Wi*.48],passenger:[0,c.L,c.zi-c.Wi*.48,c.zi],rear:[0,c.L*.42,-c.zi,c.zi],center:[c.L*.28,c.L*.78,-c.zi,c.zi],all:[0,c.L,-c.zi,c.zi]}[area];
  const skip=new Set(); ids.forEach(id=>descendants(id).forEach(x=>skip.add(x))); S.items.forEach(i=>{ if(SKIPZ.has(IT(i).zone)) skip.add(i.iid); });
  const obst=meshBoxes(root,skip).filter(b=>b.iid).concat(wellBoxes(c));
  const mem=ids.map(id=>{ const inst=S.items.find(i=>i.iid===id), g=instGroups.get(id), b=groupBox(g), c0=g.userData.c0, cur=Object.assign({x:0,y:0,z:0,r:0},inst.pos||{});
    const odd=cur.r%2, w0=odd?b.z1-b.z0:b.x1-b.x0, d0=odd?b.x1-b.x0:b.z1-b.z0; return {inst,c0,cur,w0,d0,y0:b.y0,y1:b.y1,wt:IT(inst).wt}; });
  if(strat==='balanced') mem.sort((a,b)=>b.wt-a.wt); else mem.sort((a,b)=>b.w0*b.d0-a.w0*a.d0);
  const placed=[]; let fails=0; const tx=Math.min(A[1],Math.max(A[0],(c.xr+c.xf)/2)), wallZ=A[3]>0&&A[2]>0?A[3]:A[2];
  mem.forEach((m,idx)=>{
    let best=null;
    for(const r of [0,1]){ const w=r?m.d0:m.w0, d=r?m.w0:m.d0; if(w>A[1]-A[0]+.1||d>A[3]-A[2]+.1) continue;
      const cands=[]; for(let x=A[0]+w/2;x<=A[1]-w/2+.01;x+=2) for(let z=A[2]+d/2;z<=A[3]-d/2+.01;z+=2) cands.push([x,z]);
      let score;
      if(strat==='balanced') score=([x,z])=>Math.abs(x-tx)+Math.abs(z)*1.5;
      else if(strat==='spread'){ const t=A[0]+(idx+.5)*(A[1]-A[0])/mem.length; score=([x,z])=>Math.abs(x-t)+Math.abs(z-wallZ)*.3; }
      else score=([x,z])=>x*.6+Math.abs(z-wallZ)*1.4;
      cands.sort((p,q)=>score(p)-score(q));
      for(const [x,z] of cands){ const box={x0:x-w/2,x1:x+w/2,y0:m.y0,y1:m.y1,z0:z-d/2,z1:z+d/2};
        if(obst.some(o=>hit3(box,o,.4))||placed.some(o=>hit3(box,o,.2))) continue;
        const s=score([x,z]); if(!best||s<best.s) best={x,z,r,box,s}; break; } }
    if(!best){ fails++; return; }
    placed.push(best.box);
    const rr=(m.cur.r+best.r)%4; m.inst.pos={x:Math.round((best.x-m.c0.x)*2)/2,y:m.cur.y||0,z:Math.round((best.z-m.c0.z)*2)/2,r:rr};
    if(best.r){ // rotating about the center keeps the center, so recompute offset from c0
      m.inst.pos.x=Math.round((best.x-m.c0.x)*2)/2; m.inst.pos.z=Math.round((best.z-m.c0.z)*2)/2; }
  });
  const keep=MV&&MV.iid; commit(); if(keep){ MV.inst=S.items.find(i=>i.iid===keep); mvPrepare(); }
  toast(`${STRATS[autoState.k][1]}${fails?` · ${fails} part${fails>1?'s':''} didn’t fit`:''} — tap again for another layout`);
  renderEditBar();
}

/* ---------- range model ---------- */
function rangeEst(items=S.items){
  const c=C, t=c.model, k=calc(items);
  const base = t.ev ? (t.range[Math.min(S.roofIdx,t.range.length-1)]) : t.mpg*t.tank;
  const wPen = Math.min(.3, .35*k.total/t.curb);
  const aero=[]; for(const i of items){ const it=IT(i); let a=AERO[it.zone]; if(it.custom){ const pl=(i.spec||{}).place; a=pl==='roof'?.015:pl==='rear'?.005:0; } if(it.zone==='solar'&&items.some(x=>IT(x).zone==='rack')) a=.004; if(a) aero.push([it.name,a,i.iid]); }
  const aPen=Math.min(.25,aero.reduce((s,a)=>s+a[1],0));
  const factor=Math.max(.45,1-wPen-aPen);
  return {base, range:base*factor, ev:!!t.ev, mpg:t.ev?null:t.mpg*factor, mpg0:t.mpg, wPen, aPen, aero, unit:t.ev?'mi (EV)':'mi', fuel:t.ev?'Electric':t.fuel, tank:t.tank, kwh:t.kwh};
}

    if(data.some(d=>d.it.solarW||d.it.ah||d.it.invW)) h+=row('Energy supply',data.map(d=>d.it.solarW?d.it.solarW*S.settings.sunHours*.75:d.it.ah?d.it.ah*12.8*.9:d.it.invW||0),'high',(v,i)=>{ const it=data[i].it; return it.solarW?`≈${fmtN(v)} Wh/day`:it.ah?`${fmtN(v)} Wh usable`:it.invW?`${fmtN(v)} W continuous`:'—'; });
    if(isIns){ h+=row('R-value',data.map(d=>d.rv||null),'high',v=>v?`R-${fmtN(v,1)}`:'—');
      h+=row('Heat loss @ 40°F ΔT',data.map(d=>heatLoss(d.rv)),'low',v=>v?`${fmtN(v)} BTU/hr`:'—');
      h+=row('Thickness',data.map(d=>d.it.thick||null),null,v=>v?`${v}"`:'—'); }
    h+=row('Off-grid days (your build)',data.map(d=>d.k.ah?(d.k.days===Infinity?999:d.k.days):0),'high',v=>v>=999?'∞ self-sustaining':v?fmtN(v,1)+' days':'—');
    h+=row('Payload used',data.map(d=>d.k.total/d.k.payload*100),'low',v=>`${fmtN(v)}%`);
    h+=row('Driving range',data.map(d=>d.r.range),'high',v=>`${fmtN(v)} mi`);
    h+=row('Build cost if chosen',data.map(d=>d.k.cost),'low',(v)=>`${fmt$(v)} <span class="muted">${v-base.cost?`(${v>base.cost?'+':'−'}${fmt$(Math.abs(v-base.cost))})`:''}</span>`);
    h+=row('Install difficulty',data.map(d=>d.info[3]||null),'low',v=>v?`<span class="dots">${'●'.repeat(v)}<i>${'●'.repeat(5-v)}</i></span>`:'—');
    h+=`<tr><th>Pros</th>${data.map(d=>`<td><ul class="pl">${(d.info[1]||'').split('|').filter(Boolean).map(x=>`<li>${x}</li>`).join('')}</ul></td>`).join('')}</tr>`;
    h+=`<tr><th>Cons</th>${data.map(d=>`<td><ul class="cl">${(d.info[2]||'').split('|').filter(Boolean).map(x=>`<li>${x}</li>`).join('')}</ul></td>`).join('')}</tr>`;
    h+=`<tr><th></th>${data.map(d=>`<td class="cmp-act">${d.it.custom?'':d.inB?'<span class="muted">✓ In build</span>':`<button class="tb-btn" data-use="${d.it.id}">Use in build</button>`}${d.it.custom||d.inB?'':`<button class="gplus big" data-cart="${d.it.id}" title="Add to cart">＋</button>`}</td>`).join('')}</tr>`;
    h+=`</tbody></table></div>`;
    if(isIns) h+=`<p class="note">R-values: Thinsulate SM600L ≈ R-5.2 per 1.6" layer; wool ≈ R-3.5/in; polyiso ≈ R-6/in (drops in hard cold); XPS ≈ R-5/in; closed-cell spray foam ≈ R-6.5/in; Reflectix ≈ R-1. Heat loss assumes walls + ceiling of your cargo area at a 40°F inside/outside difference, before thermal bridging.</p>`;
    h+=`<p class="note">Range and off-grid days are estimates for your current build with that part swapped in. Fuel economy figures are typical real-world estimates.</p>`;
  } else {

    h+=row('Weight',vals.map(v=>v.p[0]),'low',v=>`${v} lb/sq ft`);
    h+=row('Cost',vals.map(v=>v.p[1]),'low',v=>`$${v}/sq ft`);
    h+=row('For your build',vals.map(v=>Math.round(v.p[1]*area)),'low',v=>`${fmt$(v)}`);
    h+=row('Added weight',vals.map(v=>Math.round(v.p[0]*area)),'low',v=>`${v} lb`);
    h+=row('Durability',vals.map(v=>v.p[2]),'high',stars);
    h+=row('Moisture resistance',vals.map(v=>v.p[3]),'high',stars);
    if(slot==='wall') h+=row('Extra insulation',vals.map(v=>v.p[4]),'high',v=>v?`≈R-${v}`:'—');
    h+=`<tr><th>Pros</th>${vals.map(v=>`<td><ul class="pl">${v.p[5].split('|').map(x=>`<li>${x}</li>`).join('')}</ul></td>`).join('')}</tr>`;
    h+=`<tr><th>Cons</th>${vals.map(v=>`<td><ul class="cl">${v.p[6].split('|').map(x=>`<li>${x}</li>`).join('')}</ul></td>`).join('')}</tr>`;
    h+=`<tr><th></th>${vals.map(v=>`<td class="cmp-act">${S.defaults[slot]===v.k?'<span class="muted">✓ In build</span>':`<button class="tb-btn" data-applymat="${slot}:${v.k}">Use in build</button>`}</td>`).join('')}</tr></tbody></table></div>
      <p class="note">Weights and prices are typical figures for van-grade material at common thicknesses; your supplier’s numbers will vary.</p>`;
  }
  h+='</div>'; $('#pg-compare').innerHTML=h;
}
function matArea(slot){ const c=C;
  if(slot==='wall') return (2*c.L*(c.H-4)+c.L*c.Wi)/144;
  if(slot==='floor') return c.L*c.Wi/144;
  let a=0; for(const inst of S.items){ const it=IT(inst); if(!(it.mats||[]).includes(slot)) continue; const s=placedSize(inst.iid); if(!s) continue;
    a+= slot==='counter' ? (s.x*Math.min(s.z,26))/144 : (2*(s.x*s.y+s.z*s.y)+s.x*s.z)/144*.6; }
  return Math.max(4,a); }

});

let trkPhase=0;
function renderInstallTracker(){
  const by={need:[],have:[],installed:[]}; for(const i of S.items){ if(trkPhase&&IT(i).phase!==trkPhase) continue; by[statusOf(i)].push(i); }
  const all=S.items, n=all.length, cnt=k=>all.filter(i=>statusOf(i)===k).length, cost=k=>all.filter(i=>statusOf(i)===k).reduce((s,i)=>s+IT(i).cost,0);
  const pct=n?cnt('installed')/n*100:0;
  const next=[...all].filter(i=>statusOf(i)!=='installed').sort((a,b)=>IT(a).phase-IT(b).phase||(statusOf(a)==='have'?-1:1))[0];
  let h=`<div class="pg-wrap"><div class="pg-head"><div><h1>Install Tracker</h1><p class="muted">What you have, what you still need, and what’s already in the van.</p></div>
    <div class="seg" id="sv3d" title="How parts show in 3D"><button data-sv="all" class="${view.statusView==='all'?'on':''}">Show all in 3D</button><button data-sv="ghost" class="${view.statusView==='ghost'?'on':''}">Ghost “need”</button><button data-sv="owned" class="${view.statusView==='owned'?'on':''}">Only what I have</button></div></div>
    <div class="trk-stats">
      <div class="tstat"><small>Installed</small><b>${cnt('installed')} / ${n}</b><div class="bar"><i style="width:${pct}%;background:var(--green)"></i></div></div>
      <div class="tstat"><small>Have, ready to install</small><b>${cnt('have')}</b><span class="muted">${fmt$(cost('have'))}</span></div>
      <div class="tstat"><small>🛒 Need to buy</small><b>${cnt('need')}</b><span class="muted">${fmt$(cost('need'))} to go</span></div>
      <div class="tstat"><small>Spent so far</small><b>${fmt$(cost('have')+cost('installed'))}</b><span class="muted">of ${fmt$(all.reduce((s,i)=>s+IT(i).cost,0))}</span></div>
    </div>
    ${next?`<div class="nextup"><span>Next up</span><b>${esc(IT(next).name)}</b><em>Phase ${IT(next).phase} · ${PHASES[IT(next).phase]} · ${statusOf(next)==='have'?'ready to install':'buy it first'}</em><button class="tb-btn primary" data-adv="${next.iid}">${statusOf(next)==='have'?'Mark installed':'Mark bought'}</button></div>`:n?`<div class="nextup done">🎉 Everything is installed.</div>`:''}
    <div class="chips-row">${[0,1,2,3,4].map(p=>`<button class="pchip ${trkPhase===p?'on':''}" data-tp="${p}">${p?`Phase ${p} · ${PHASES[p]}`:'All phases'}</button>`).join('')}</div>
    <div class="kanban">${STATUS.map(([k,nm,ic])=>`<div class="kcol"><div class="khead">${ic} ${nm}<span>${by[k].length}</span></div>${by[k].sort((a,b)=>IT(a).phase-IT(b).phase).map(i=>{ const it=IT(i); return `<div class="kcard"><div class="grow" data-go="part-${i.iid}"><b>${esc(it.name)}</b><small>P${it.phase} · ${fmt$(it.cost)} · ${it.wt} lb</small></div><div class="kbtns">${k!=='need'?`<button data-back="${i.iid}" title="Move back">◀</button>`:''}${k!=='installed'?`<button class="adv" data-adv="${i.iid}" title="${k==='need'?'Mark bought':'Mark installed'}">${k==='need'?'Bought ▶':'Installed ✓'}</button>`:''}</div></div>`; }).join('')||'<div class="kempty">Nothing here</div>'}</div>`).join('')}</div></div>`;
  $('#pg-tracker').innerHTML=h;
}
$('#pg-tracker').addEventListener('click',e=>{
  const sv=e.target.closest('[data-sv]'); if(sv){ view.statusView=sv.dataset.sv; applyVisibility(); renderInstallTracker(); return; }
  const tp=e.target.closest('[data-tp]'); if(tp){ trkPhase=+tp.dataset.tp; renderInstallTracker(); return; }
  const ad=e.target.closest('[data-adv]'); if(ad){ const i=S.items.find(x=>x.iid===ad.dataset.adv); i.status=statusOf(i)==='need'?'have':'installed'; commit(); renderInstallTracker(); toast(i.status==='have'?`📦 Bought <b>${esc(IT(i).name)}</b>`:`✅ Installed <b>${esc(IT(i).name)}</b>`); return; }
  const bk=e.target.closest('[data-back]'); if(bk){ const i=S.items.find(x=>x.iid===bk.dataset.back); i.status=statusOf(i)==='installed'?'have':'need'; commit(); renderInstallTracker(); }
});

function pRow(i,right){ const it=IT(i); return `<div class="prow" data-go="part-${i.iid}"><span class="pst">${STATUS.find(s=>s[0]===statusOf(i))[2]}</span><div class="grow"><b>${esc(it.name)}</b><small>Phase ${it.phase} · ${it.wt} lb</small></div><span class="pr">${right}</span><em>›</em></div>`; }

function connections(inst){ const it=IT(inst), z=it.zone, out=[], has=x=>C.has(x);
  if(['fridge','fan','heater','hydronic','sink','bed','bath'].includes(z)&&it.draw) out.push(['12 V DC',has('battery')?'Wired to the battery bank through the fuse block':'Needs a battery bank to run']);
  if(['cook','ac'].includes(z)&&it.draw) out.push(['120 V AC',has('inverter')?'Powered by the inverter':'Needs an inverter']);
  if(z==='panel') out.push(['12 V DC','LED strips on dimmable circuits from the fuse block']);
  if(z==='solar') out.push(['Solar',has('battery')?'Roof gland → MPPT charge controller → battery bank':'Needs a battery bank and charge controller']);
  if(z==='battery') out.push(['Bus bars','Feeds the fuse block, inverter and DC-DC charger']);
  if(z==='inverter') out.push(['Battery',has('battery')?'Thick cables to the battery bank with a class-T fuse':'Needs a battery bank'],['Shore',has('shore')?'Shore inlet feeds the built-in charger':'Add a shore inlet to charge at campgrounds']);
  if(z==='dcdc') out.push(['Alternator','Starter battery → DC-DC charger → house battery']);
  if(z==='shore') out.push(['Inverter',has('inverter')?'Feeds the inverter/charger':'Needs an inverter/charger or separate charger']);
  if(z==='sink'||z==='bath'||z==='oshower') out.push(['Fresh water',has('fresh')?'12V pump from the fresh tank':'Needs a fresh water tank']);
  if(z==='sink'||(z==='bath'&&inst.cid==='wetbath')) out.push(['Drain',has('grey')?'Drains to the grey tank':'Needs a grey tank']);
  if(z==='fresh') out.push(['Supplies',['sink','bath','oshower'].filter(has).map(x=>IT(has(x)).name).join(', ')||'Nothing yet']);
  if(z==='grey') out.push(['Collects from',['sink','bath'].filter(has).map(x=>IT(has(x)).name).join(', ')||'Nothing yet']);
  return out; }
function renderPartPage(iid){
  const inst=S.items.find(i=>i.iid===iid); if(!inst){ $('#pg-part').innerHTML=`<div class="pg-wrap"><div class="empty">That part isn’t in the build anymore. <a href="#build" style="color:var(--cyan)">Back to build</a></div></div>`; return; }
  const it=IT(inst), info=INFO[it.id]||[it.custom?'Custom part you added.':'', '', '', 0], g=instGroups.get(iid), k=calc();
  const img=snapPart(iid);
  let loc=''; if(g){ const b=groupBox(g), c=C; const side=(b.z0+b.z1)/2<-6?'driver side':(b.z0+b.z1)/2>6?'passenger side':'center';
    loc=`${fmtN(Math.max(0,b.x0),1)} in from the rear doors · ${side} · ${b.y0<c.f-1?`${fmtN(b.y0,1)} in above the ground`:b.y0>c.roofY-1?'on the roof':`${fmtN(Math.max(0,b.y0-c.fy),1)} in above the floor`}`; }
  const ps=placedSize(iid), conns=connections(inst), share=k.draw&&it.draw?it.draw/k.draw*100:0;
  const st=statusOf(inst), m=mountOf(inst);
  let h=`<div class="pg-wrap part">
    <button class="back" data-goback="1">‹ Back</button>
    <div class="pp-top"><div class="pp-img">${img?`<img src="${img}" alt="">`:''}</div>
      <div class="pp-info"><small>${esc((CATALOG.find(x=>x.id===it.cat)||{name:CAT_NAME[it.cat]||'Custom'}).name)} · Phase ${it.phase} · ${PHASES[it.phase]}</small><h1>${esc(it.name)}</h1><p>${esc(info[0])}</p>
        <div class="pop-status big">${STATUS.map(([s,n,ic])=>`<button data-pst="${s}" class="${st===s?'on':''}">${ic} ${n}</button>`).join('')}</div>
        <div class="pp-btns"><button class="tb-btn primary" data-pm="move" ${m==='fixed'?'disabled':''}>✥ Move in 3D</button><button class="tb-btn" data-pm="cmp">⚖ Compare alternatives</button><button class="tb-btn" data-pm="remove">Remove</button></div></div></div>
    <div class="pp-grid">
      <div class="card"><h3>Measurements</h3><div class="spec">
        <span>Spec size (W×D×H)</span><span>${it.sz?`${sizeTxt(it.sz)}`:'Sized to vehicle'}</span>${it.sz?`<span></span><span>${sizeCm(it.sz)}</span>`:''}
        ${ps?`<span>As placed (L×W×H)</span><span>${fmtN(ps.x,1)} × ${fmtN(ps.z,1)} × ${fmtN(ps.y,1)} in</span><span></span><span>${fmtN(ps.x*2.54)} × ${fmtN(ps.z*2.54)} × ${fmtN(ps.y*2.54)} cm</span>`:''}
        <span>Weight</span><span>${it.wt} lb · ${fmtN(lb2kg(it.wt),1)} kg</span><span>Share of payload</span><span>${fmtN(it.wt/k.payload*100,1)}%</span></div></div>
      <div class="card"><h3>Location on the vehicle</h3><div class="spec"><span>Mounting</span><span>${MOUNT_NAME[m]}</span><span>Position</span><span style="white-space:normal">${loc||'—'}</span>${inst.pos?`<span>Moved from default</span><span>${fmtN(inst.pos.x,1)} / ${fmtN(inst.pos.z,1)} in${inst.pos.r?` · ${inst.pos.r*90}°`:''}</span>`:''}</div></div>
      <div class="card"><h3>Energy</h3><div class="spec"><span>Uses</span><span>${it.draw?`${it.draw} Wh/day`:'No power'}</span>${it.draw?`<span>Share of daily use</span><span>${fmtN(share)}%</span><span>Per year</span><span>${fmtN(it.draw*365/1000)} kWh</span>`:''}${it.solarW?`<span>Produces</span><span>≈${fmtN(it.solarW*S.settings.sunHours*.75)} Wh/day</span>`:''}${it.ah?`<span>Stores</span><span>${fmtN(it.ah*12.8*.9)} Wh usable</span>`:''}${it.fresh?`<span>Holds</span><span>${it.fresh} gal · ${fmtN(it.fresh*8.34)} lb full</span>`:''}${it.rv?`<span>Insulation</span><span>R-${it.rv}</span>`:''}</div></div>
      <div class="card"><h3>Cost</h3><div class="spec"><span>Price</span><span>${fmt$(it.cost)}</span><span>Share of build</span><span>${fmtN(it.cost/(k.cost||1)*100,1)}%</span><span>Install difficulty</span><span>${info[3]?`<span class="dots">${'●'.repeat(info[3])}<i>${'●'.repeat(5-info[3])}</i></span>`:'—'}</span></div></div>
      ${conns.length?`<div class="card wide"><h3>Connections</h3>${conns.map(([a,b])=>`<div class="conn"><b>${a}</b><span>${esc(b)}</span></div>`).join('')}</div>`:''}
      ${info[1]?`<div class="card"><h3>Pros</h3><ul class="pl">${info[1].split('|').map(x=>`<li>${x}</li>`).join('')}</ul></div><div class="card"><h3>Cons</h3><ul class="cl">${info[2].split('|').map(x=>`<li>${x}</li>`).join('')}</ul></div>`:''}
      ${(it.mats||[]).length?`<div class="card wide"><h3>Materials</h3><div class="pp-mats">${it.mats.map(s=>{ const mk=matOf(inst,s); return `<div><img src="${swatch(mk)}" alt=""><b>${SLOT_NAME[s]}</b><span>${MATNAME[mk]}</span></div>`; }).join('')}</div></div>`:''}
    </div></div>`;
  $('#pg-part').innerHTML=h; $('#pg-part').dataset.iid=iid;
}
$('#pg-part').addEventListener('click',e=>{
  const iid=$('#pg-part').dataset.iid, inst=S.items.find(i=>i.iid===iid); if(!inst) return;
  const s=e.target.closest('[data-pst]'); if(s){ inst.status=s.dataset.pst; commit(); renderPartPage(iid); return; }
  const p=e.target.closest('[data-pm]'); if(!p) return;
  if(p.dataset.pm==='move'){ go('build'); setTimeout(()=>{ select(iid); moveBegin(iid); },60); }
  else if(p.dataset.pm==='cmp'){ const it=IT(inst); cmpState.mode='parts'; cmpState.ids=it.custom?['custom:'+iid]:(ZONE[it.zone].length>1?ZONE[it.zone].slice(0,4):[it.id]); go('compare'); }
  else if(p.dataset.pm==='remove'){ removeInst(iid); go('build'); }
});

/* ---------- cart ---------- */
function addToCart(cid){
  const it=ITEM[cid]; if(!it) return; const ex=S.items.find(i=>i.cid===cid);
  if(ex){ toast(`<b>${it.name}</b> is already in your project (${STATUS.find(s=>s[0]===statusOf(ex))[1].toLowerCase()})`); return; }
  addItem(cid,true); toast(`🛒 Added <b>${it.name}</b> to your cart — it’s in your project & profile`);
}
function updCart(){ const n=S.items.filter(i=>statusOf(i)==='need').length; document.querySelectorAll('.cartn').forEach(e=>{ e.textContent=n; e.hidden=!n; }); }

/* ---------- mobile sheets ---------- */
function openSheet(which,tab){ closeSheets(); if(which==='left'){ setTab(tab); $('#sheetTitleL').textContent={vehicle:'Vehicle',catalog:'Parts',finish:'Finishes'}[tab]; $('#left').classList.add('open'); } else { $('#right').classList.add('open'); } document.body.classList.add('sheet-open'); }
function closeSheets(){ $('#left').classList.remove('open'); $('#right').classList.remove('open'); document.body.classList.remove('sheet-open'); document.querySelectorAll('#mnav [data-sheet]').forEach(b=>b.classList.remove('on')); }
document.querySelectorAll('.sclose').forEach(b=>b.onclick=closeSheets);
document.querySelectorAll('[data-sheet]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); const [w,t]=b.dataset.sheet.split(':'); if(curPage!=='build') go('build'); const isOpen=(w==='left'?$('#left'):$('#right')).classList.contains('open')&&(w!=='left'||!$('#p-'+t).hidden); if(isOpen){ closeSheets(); return; } setTimeout(()=>{ openSheet(w,t); b.classList.add('on'); },curPage!=='build'?30:0); });
$('#bUndo').onclick=undo; $('#bRedo').onclick=redo;
initNoPaint();

/* =====================================================================
   LOOP
   ===================================================================== */
function resize(){ const r=vp.getBoundingClientRect(); if(!r.width||!r.height) return; renderer.setSize(r.width,r.height,false); camera.aspect=r.width/r.height; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(vp);
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function loop(now){
  requestAnimationFrame(loop);
  if(tween){ const t=Math.min(1,(now-tween.s)/tween.d), k=ease(t); camera.position.lerpVectors(tween.p0,tween.p1,k); controls.target.lerpVectors(tween.t0,tween.t1,k); if(t>=1) tween=null; }
  controls.update();
  doorAnim.rear+= (doorAnim.rearT-doorAnim.rear)*.08; doorAnim.slide+=(doorAnim.slideT-doorAnim.slide)*.08;
  if(doorRefs.rear){ if(doorRefs.rear.roll) doorRefs.rear.roll.position.y=doorAnim.rear*doorRefs.rear.h; else { doorRefs.rear.l.rotation.y=-doorAnim.rear*1.85; doorRefs.rear.r.rotation.y=doorAnim.rear*1.85; } }
  if(doorRefs.slide){ const s=doorAnim.slide; doorRefs.slide.g.position.set(-doorRefs.slide.len*Math.max(0,(s-.15)/.85), 0, 2.6*Math.min(1,s*5)); }
  if(doorRefs.okit) doorRefs.okit.position.x=-26*doorAnim.rear;
  exCur+=(view.explode-exCur)*.12; if(Math.abs(view.explode-exCur)<.0005) exCur=view.explode;
  for(const o of EXPL){ const e=o.userData.ex; o.position.set(e.base.x+e.v.x*exCur,e.base.y+e.v.y*exCur,e.base.z+e.v.z*exCur); }
  updateCamSide();
  const settled=Math.abs(exCur-view.explode)<.002; selDims.visible=settled;
  if(view.sel){ placePop(); selHelper.visible=true; if(selDimsDirty&&settled){ buildSelDims(); selDimsDirty=false; } }
  if(curPage==='build') renderer.render(scene,camera);
}

/* =====================================================================
   INIT
   ===================================================================== */
resize();
commit(); renderCams(); renderPhases();
goPreset('ext',true);
route(); updHist(); updCart();
requestAnimationFrame(loop);
window.__nf={select,moveBegin,moveEnd,nudge,rotatePart,flipSide,autoArrange,resetPart,cluster,get S(){return S},get MV(){return MV},go,undo,redo,addToCart};
setTimeout(()=>$('#loading').classList.add('gone'),150);
if(innerWidth<=860){ $('#main').classList.add('noL','noR'); }
</script>
